<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="beakerLiquid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lab Bench Floor / Backdrop -->
  <rect x="4" y="6" width="152" height="108" rx="14" fill="url(#labBg)" stroke="#14b8a6" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle Lab Grid Background -->
  <line x1="4" y1="36" x2="156" y2="36" stroke="#1e293b" stroke-width="1"/>
  <line x1="4" y1="66" x2="156" y2="66" stroke="#1e293b" stroke-width="1"/>
  <line x1="4" y1="96" x2="156" y2="96" stroke="#1e293b" stroke-width="1"/>
  <line x1="44" y1="6" x2="44" y2="114" stroke="#1e293b" stroke-width="1"/>
  <line x1="84" y1="6" x2="84" y2="114" stroke="#1e293b" stroke-width="1"/>
  <line x1="124" y1="6" x2="124" y2="114" stroke="#1e293b" stroke-width="1"/>

  <!-- Lab Bench Surface -->
  <rect x="8" y="90" width="144" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="8" y="90" width="144" height="3" fill="#0d9488"/>

  <!-- Microscope (Center-Left) -->
  <g transform="translate(32, 28)">
    <!-- Base -->
    <rect x="2" y="60" width="34" height="6" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="0.75"/>
    <rect x="12" y="55" width="14" height="5" fill="#334155"/>
    <!-- Stage -->
    <rect x="8" y="44" width="22" height="3" rx="1" fill="#1e293b" stroke="#64748b" stroke-width="0.5"/>
    <line x1="14" y1="44" x2="24" y2="44" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Arm -->
    <path d="M 24,55 C 36,48 38,26 26,16 L 20,16" stroke="#64748b" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 24,55 C 36,48 38,26 26,16 L 20,16" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Body Tube & Eyepiece -->
    <rect x="16" y="8" width="6" height="14" rx="1" fill="#cbd5e1" transform="rotate(-18 19 15)"/>
    <ellipse cx="23" cy="7" rx="4" ry="2" fill="#0284c7" stroke="#cbd5e1" stroke-width="0.75" transform="rotate(-18 23 7)"/>
    <!-- Revolving Nosepiece & Objectives -->
    <circle cx="18" cy="32" r="5" fill="#334155" stroke="#94a3b8" stroke-width="0.5"/>
    <rect x="16" y="36" width="3" height="7" fill="#f59e0b"/>
    <rect x="20" y="35" width="3" height="5" fill="#10b981"/>
    <!-- Light Source Substage -->
    <ellipse cx="19" cy="51" rx="4" ry="2" fill="#fef08a" filter="url(#glow)"/>
  </g>

  <!-- Conical Flask (Center-Right) -->
  <g transform="translate(86, 38)">
    <!-- Flask Glass Outline -->
    <path d="M 18,12 L 18,22 L 5,54 C 3,59 7,62 12,62 L 32,62 C 37,62 41,59 39,54 L 26,22 L 26,12 Z" fill="#0f2b38" stroke="#5eead4" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Flask Rim -->
    <rect x="16" y="10" width="12" height="3" rx="1" fill="#99f6e4" stroke="#5eead4" stroke-width="0.5"/>
    <!-- Liquid Content -->
    <path d="M 8,46 Q 22,43 36,46 L 33,56 C 32,60 29,61 24,61 L 20,61 C 15,61 12,60 11,56 Z" fill="url(#flaskLiquid)" opacity="0.85"/>
    <!-- Measurement lines -->
    <line x1="20" y1="36" x2="25" y2="36" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <line x1="17" y1="42" x2="23" y2="42" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <line x1="14" y1="48" x2="21" y2="48" stroke="#ffffff" stroke-width="0.75" opacity="0.6"/>
    <!-- Bubbles -->
    <circle cx="20" cy="52" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="26" cy="48" r="1" fill="#ffffff" opacity="0.8"/>
    <circle cx="22" cy="38" r="1" fill="#2dd4bf" filter="url(#glow)"/>
  </g>

  <!-- Test Tubes in Rack (Right) -->
  <g transform="translate(126, 48)">
    <!-- Rack Stand -->
    <rect x="2" y="32" width="24" height="12" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="0.5"/>
    <rect x="0" y="44" width="28" height="3" rx="1" fill="#334155"/>
    <!-- Tube 1 (Purple) -->
    <rect x="5" y="10" width="5" height="28" rx="2.5" fill="#1e1b4b" stroke="#c084fc" stroke-width="1"/>
    <rect x="5" y="24" width="5" height="14" rx="2.5" fill="url(#beakerLiquid)"/>
    <!-- Tube 2 (Amber) -->
    <rect x="12" y="6" width="5" height="32" rx="2.5" fill="#451a03" stroke="#fcd34d" stroke-width="1"/>
    <rect x="12" y="20" width="5" height="18" rx="2.5" fill="#f59e0b"/>
    <!-- Tube 3 (Cyan) -->
    <rect x="19" y="12" width="5" height="26" rx="2.5" fill="#042f2e" stroke="#5eead4" stroke-width="1"/>
    <rect x="19" y="26" width="5" height="12" rx="2.5" fill="#14b8a6"/>
  </g>

  <!-- Floating Sparkles / Science Badge -->
  <g transform="translate(18, 16)">
    <circle cx="8" cy="8" r="8" fill="#14b8a6" fill-opacity="0.2"/>
    <path d="M 8,2 L 10,6 L 14,8 L 10,10 L 8,14 L 6,10 L 2,8 L 6,6 Z" fill="#facc15" filter="url(#glow)"/>
  </g>
  <g transform="translate(136, 18)">
    <path d="M 5,0 L 6,3 L 9,5 L 6,7 L 5,10 L 4,7 L 1,5 L 4,3 Z" fill="#38bdf8"/>
  </g>
</svg>
