<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mazeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Wall Glow -->
    <filter id="wallGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Character Glow -->
    <filter id="charGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="virusGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>

    <linearGradient id="virusPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="virusRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="240" rx="16" fill="url(#mazeBg)" />

  <!-- Maze Grid Gridlines (Subtle Floor Tiles) -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 30 H 320 M 0 60 H 320 M 0 90 H 320 M 0 120 H 320 M 0 150 H 320 M 0 180 H 320 M 0 210 H 320" />
    <path d="M 40 0 V 240 M 80 0 V 240 M 120 0 V 240 M 160 0 V 240 M 200 0 V 240 M 240 0 V 240 M 280 0 V 240" />
  </g>

  <!-- Neon Maze Walls -->
  <g filter="url(#wallGlow)" stroke="url(#wallGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer borders -->
    <path d="M 20 20 H 300 V 220 H 20 Z" opacity="0.6"/>
    <!-- Internal corridors -->
    <path d="M 20 70 H 90 V 120" />
    <path d="M 130 20 V 80 H 190" />
    <path d="M 230 70 H 300" />
    <path d="M 90 160 H 170 V 120" />
    <path d="M 210 120 H 270 V 180" />
    <path d="M 60 220 V 170 H 20" />
    <path d="M 130 220 V 180 H 200" />
  </g>

  <!-- Answer Zones in Corners -->
  <!-- Zone A (Top Left) -->
  <g transform="translate(30, 30)">
    <rect width="45" height="30" rx="8" fill="#ef4444" fill-opacity="0.3" stroke="#f87171" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="22" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#fecaca" text-anchor="middle">A</text>
  </g>
  <!-- Zone B (Top Right) -->
  <g transform="translate(245, 30)">
    <rect width="45" height="30" rx="8" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="22" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#bfdbfe" text-anchor="middle">B</text>
  </g>
  <!-- Zone C (Bottom Left) -->
  <g transform="translate(30, 180)">
    <rect width="45" height="30" rx="8" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="22" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#a7f3d0" text-anchor="middle">C</text>
  </g>
  <!-- Zone D (Bottom Right) -->
  <g transform="translate(245, 180)">
    <rect width="45" height="30" rx="8" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="22" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#fde68a" text-anchor="middle">D</text>
  </g>

  <!-- Cell Illustrations Floating in Maze as Educational Icons -->
  <!-- Animal Cell Icon -->
  <g transform="translate(55, 125) scale(0.65)" filter="url(#charGlow)">
    <ellipse cx="25" cy="25" rx="24" ry="20" fill="#fde047" stroke="#eab308" stroke-width="3"/>
    <circle cx="25" cy="25" r="9" fill="#a855f7" stroke="#7e22ce" stroke-width="2"/>
    <circle cx="27" cy="23" r="3" fill="#f3e8ff"/>
    <ellipse cx="14" cy="20" rx="4" ry="2" fill="#ef4444"/>
    <ellipse cx="34" cy="30" rx="4" ry="2" fill="#ef4444"/>
  </g>

  <!-- Plant Cell Icon -->
  <g transform="translate(235, 130) scale(0.65)" filter="url(#charGlow)">
    <polygon points="6,4 44,4 48,46 2,46" fill="url(#plantGrad)" stroke="#047857" stroke-width="3"/>
    <ellipse cx="25" cy="25" rx="14" ry="10" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="15" cy="16" r="6" fill="#a855f7"/>
    <ellipse cx="36" cy="18" rx="4" ry="2.5" fill="#15803d"/>
    <ellipse cx="14" cy="36" rx="4" ry="2.5" fill="#15803d"/>
  </g>

  <!-- Cute Cartoon Virus 1 (Green) Chasing -->
  <g transform="translate(195, 75) scale(0.75)" filter="url(#charGlow)">
    <!-- Spikes -->
    <line x1="20" y1="2" x2="20" y2="8" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="38" x2="20" y2="32" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="20" x2="8" y2="20" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="38" y1="20" x2="32" y2="20" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="7" y1="7" x2="12" y2="12" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="33" y1="7" x2="28" y2="12" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="7" y1="33" x2="12" y2="28" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <line x1="33" y1="33" x2="28" y2="28" stroke="#65a30d" stroke-width="3" stroke-linecap="round"/>
    <!-- Body -->
    <circle cx="20" cy="20" r="14" fill="url(#virusGreenGrad)" stroke="#3f6212" stroke-width="2"/>
    <!-- Cute Eyes -->
    <ellipse cx="16" cy="18" rx="3.5" ry="4.5" fill="#ffffff"/>
    <circle cx="15" cy="18" r="2" fill="#1e293b"/>
    <ellipse cx="24" cy="18" rx="3.5" ry="4.5" fill="#ffffff"/>
    <circle cx="23" cy="18" r="2" fill="#1e293b"/>
    <!-- Cute Grin -->
    <path d="M 17 24 Q 20 27 23 24" stroke="#1e293b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cute Cartoon Virus 2 (Purple) -->
  <g transform="translate(100, 165) scale(0.7)" filter="url(#charGlow)">
    <!-- Spikes with knobs -->
    <circle cx="20" cy="4" r="3" fill="#a855f7"/>
    <circle cx="20" cy="36" r="3" fill="#a855f7"/>
    <circle cx="4" cy="20" r="3" fill="#a855f7"/>
    <circle cx="36" cy="20" r="3" fill="#a855f7"/>
    <!-- Body -->
    <circle cx="20" cy="20" r="13" fill="url(#virusPurpleGrad)" stroke="#581c87" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="16" cy="18" r="3.5" fill="#fff"/>
    <circle cx="17" cy="18" r="1.8" fill="#4c1d95"/>
    <circle cx="24" cy="18" r="3.5" fill="#fff"/>
    <circle cx="25" cy="18" r="1.8" fill="#4c1d95"/>
    <!-- Mouth -->
    <path d="M 18 24 Q 20 22 22 24" stroke="#4c1d95" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Cute Cartoon Virus 3 (Red Hunter) -->
  <g transform="translate(90, 35) scale(0.65)" filter="url(#charGlow)">
    <circle cx="20" cy="20" r="14" fill="url(#virusRedGrad)" stroke="#7f1d1d" stroke-width="2"/>
    <path d="M 12 10 L 20 2 L 28 10" stroke="#b91c1c" stroke-width="3" fill="none"/>
    <circle cx="15" cy="19" r="4" fill="#fff"/>
    <circle cx="17" cy="19" r="2" fill="#450a0a"/>
    <circle cx="25" cy="19" r="4" fill="#fff"/>
    <circle cx="23" cy="19" r="2" fill="#450a0a"/>
    <path d="M 16 26 Q 20 28 24 26" stroke="#450a0a" stroke-width="2" fill="none"/>
  </g>

  <!-- HERO STUDENT CHARACTER (Navigating the maze with confidence!) -->
  <g transform="translate(138, 98)" filter="url(#charGlow)">
    <!-- Shadow -->
    <ellipse cx="22" cy="46" rx="14" ry="4" fill="#000000" opacity="0.4"/>
    
    <!-- Student Body (Lab Coat / School Uniform) -->
    <!-- Legs -->
    <rect x="15" y="38" width="5" height="8" rx="2" fill="#1e3a8a"/>
    <rect x="24" y="38" width="5" height="8" rx="2" fill="#1e3a8a"/>
    <!-- Shoes -->
    <ellipse cx="17" cy="46" rx="4" ry="2" fill="#0f172a"/>
    <ellipse cx="27" cy="46" rx="4" ry="2" fill="#0f172a"/>

    <!-- White Lab Coat / Shirt -->
    <path d="M 11 22 Q 13 40 15 40 H 29 Q 31 40 33 22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 22 22 V 40" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Teal Badge on Coat -->
    <circle cx="16" cy="28" r="2" fill="#0d9488"/>

    <!-- Head & Face -->
    <circle cx="22" cy="15" r="11" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
    <!-- Hair -->
    <path d="M 11 15 C 11 6, 33 6, 33 15 C 31 10, 26 8, 22 8 C 18 8, 13 10, 11 15 Z" fill="#451a03"/>
    
    <!-- Eyes -->
    <circle cx="18" cy="15" r="1.8" fill="#1e293b"/>
    <circle cx="26" cy="15" r="1.8" fill="#1e293b"/>
    <circle cx="18.5" cy="14.5" r="0.6" fill="#ffffff"/>
    <circle cx="26.5" cy="14.5" r="0.6" fill="#ffffff"/>

    <!-- Cheerful Smile -->
    <path d="M 20 19 Q 22 22 24 19" stroke="#ea580c" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Student Goggles / Science Visor on Forehead -->
    <rect x="13" y="7" width="18" height="5" rx="2.5" fill="#38bdf8" fill-opacity="0.8" stroke="#0284c7" stroke-width="1"/>
    <ellipse cx="17" cy="9.5" rx="3" ry="1.5" fill="#e0f2fe"/>
    <ellipse cx="27" cy="9.5" rx="3" ry="1.5" fill="#e0f2fe"/>

    <!-- Hand with Magnifying Glass / Science Flashlight -->
    <line x1="32" y1="26" x2="39" y2="22" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="41" cy="20" r="5" fill="#a5f3fc" fill-opacity="0.6" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="44" y1="24" x2="48" y2="28" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Action Sparks & Trail -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="130" cy="115" r="2" />
    <circle cx="124" cy="122" r="1.5" />
    <circle cx="134" cy="128" r="1" />
  </g>
</svg>
