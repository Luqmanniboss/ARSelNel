<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <style>
    .node-text {
      font-family: 'Inter', sans-serif;
      font-size: 6.5px;
      font-weight: 600;
      fill: #475569;
    }
  </style>

  <!-- Node 1: Sel -->
  <g transform="translate(20, 35)">
    <circle cx="0" cy="0" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="4.5" fill="#0284c7"/>
    <text x="0" y="24" class="node-text" text-anchor="middle">Sel</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 42,35 L 48,35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 46,32 L 49,35 L 46,38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Node 2: Tisu -->
  <g transform="translate(68, 35)">
    <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
    <circle cx="-5" cy="-5" r="3.5" fill="#f472b6" opacity="0.6"/>
    <circle cx="5" cy="-5" r="3" fill="#f472b6" opacity="0.6"/>
    <circle cx="-5" cy="5" r="3" fill="#f472b6" opacity="0.6"/>
    <circle cx="5" cy="5" r="3.5" fill="#f472b6" opacity="0.6"/>
    <text x="0" y="24" class="node-text" text-anchor="middle">Tisu</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 90,35 L 96,35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 94,32 L 97,35 L 94,38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Node 3: Organ -->
  <g transform="translate(116, 35)">
    <circle cx="0" cy="0" r="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <path d="M 0,-6 C -4,-11 -10,-7 -7,-2 L 0,6 L 7,-2 C 10,-7 4,-11 0,-6 Z" fill="#ef4444"/>
    <text x="0" y="24" class="node-text" text-anchor="middle">Organ</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 138,35 L 144,35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 142,32 L 145,35 L 142,38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Node 4: Sistem -->
  <g transform="translate(164, 35)">
    <circle cx="0" cy="0" r="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#16a34a" stroke-width="1.5"/>
    <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#16a34a" stroke-width="1.2"/>
    <line x1="-5" y1="2" x2="5" y2="2" stroke="#16a34a" stroke-width="1.2"/>
    <circle cx="0" cy="-8" r="2" fill="#16a34a"/>
    <text x="0" y="24" class="node-text" text-anchor="middle">Sistem</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 186,35 L 192,35" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 190,32 L 193,35 L 190,38" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Node 5: Organisma -->
  <g transform="translate(212, 35)">
    <circle cx="0" cy="0" r="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <path d="M -7,4 H -1 L -1,-2 C -1,-4 -3,-5 -5,-3 Z" fill="#ca8a04"/>
    <rect x="-5" y="-1" width="10" height="6" rx="2" fill="#ca8a04"/>
    <line x1="-4" y1="5" x2="-4" y2="9" stroke="#ca8a04" stroke-width="1.2"/>
    <line x1="-1" y1="5" x2="-1" y2="9" stroke="#ca8a04" stroke-width="1.2"/>
    <line x1="2" y1="5" x2="2" y2="9" stroke="#ca8a04" stroke-width="1.2"/>
    <circle cx="5" cy="-4" r="3.2" fill="#ca8a04"/>
    <path d="M 5,-7 L 6,-4" stroke="#ca8a04" stroke-width="1"/>
    <text x="0" y="24" class="node-text" text-anchor="middle">Organisma</text>
  </g>
</svg>
