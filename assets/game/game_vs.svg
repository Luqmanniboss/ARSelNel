<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <defs>
    <radialGradient id="animalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="80%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </radialGradient>
    <radialGradient id="plantGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="85%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#86efac"/>
    </radialGradient>
  </defs>

  <!-- Animal Cell (Left) -->
  <g transform="translate(38, 60)">
    <circle cx="0" cy="0" r="28" fill="url(#animalGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="-5" cy="-5" r="7" fill="#d946ef" stroke="#f472b6" stroke-width="0.5"/>
    <circle cx="-6" cy="-7" r="2.5" fill="#fbcfe8"/>
    <!-- Small organelles -->
    <rect x="8" y="8" width="8" height="4" rx="2" fill="#fb923c" transform="rotate(30, 8, 8)"/>
    <circle cx="-12" cy="10" r="2" fill="#38bdf8"/>
  </g>

  <!-- Plant Cell (Right) -->
  <g transform="translate(122, 60)">
    <!-- Hexagonal cell wall -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#plantGrad)" stroke="#10b981" stroke-width="2"/>
    <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.6"/>
    <!-- Nucleus -->
    <circle cx="-10" cy="-6" r="6" fill="#d946ef" stroke="#f472b6" stroke-width="0.5"/>
    <!-- Large vacuole -->
    <ellipse cx="6" cy="4" rx="10" ry="14" fill="#38bdf8" stroke="#0284c7" stroke-width="0.5" opacity="0.8" transform="rotate(15, 6, 4)"/>
    <!-- Chloroplasts -->
    <circle cx="-12" cy="14" r="2.5" fill="#16a34a"/>
    <circle cx="-2" cy="-15" r="2.5" fill="#16a34a"/>
  </g>

  <!-- "VS" Badge in the Center -->
  <g transform="translate(80, 60)">
    <circle cx="0" cy="0" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#f59e0b" text-anchor="middle">VS</text>
  </g>
</svg>
