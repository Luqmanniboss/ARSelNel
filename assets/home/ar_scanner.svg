<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background grids -->
  <path d="M 10,20 L 110,20 M 10,40 L 110,40 M 10,60 L 110,60 M 10,80 L 110,80" stroke="#bfdbfe" stroke-width="0.5" opacity="0.3"/>
  <path d="M 30,10 L 30,90 M 60,10 L 60,90 M 90,10 L 90,90" stroke="#bfdbfe" stroke-width="0.5" opacity="0.3"/>

  <!-- Scanning grid / glow -->
  <path d="M 25,20 L 95,20 L 80,75 L 40,75 Z" fill="url(#scanGrad)" opacity="0.15"/>

  <!-- Phone frame perspective -->
  <rect x="35" y="15" width="50" height="70" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="38" y="18" width="44" height="64" rx="3" fill="#0f172a"/>
  
  <!-- Home Indicator / Notch -->
  <rect x="53" y="19" width="14" height="2" rx="1" fill="#475569"/>
  <rect x="50" y="80" width="20" height="1" rx="0.5" fill="#475569"/>

  <!-- Glowing Cell on Phone Screen -->
  <circle cx="60" cy="50" r="14" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="60" cy="50" r="8" fill="#3b82f6" opacity="0.7"/>
  <circle cx="57" cy="47" r="3" fill="#93c5fd"/>
  
  <!-- AR holographic corner indicators -->
  <path d="M 20,25 L 20,15 L 30,15" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100,25 L 100,15 L 90,15" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20,75 L 20,85 L 30,85" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100,75 L 100,85 L 90,85" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Floating cubes -->
  <path d="M 20,40 L 25,37 L 30,40 L 25,43 Z" fill="#60a5fa" opacity="0.7"/>
  <path d="M 20,40 L 25,43 L 25,48 L 20,45 Z" fill="#3b82f6" opacity="0.7"/>
  <path d="M 30,40 L 25,43 L 25,48 L 30,45 Z" fill="#2563eb" opacity="0.7"/>

  <path d="M 95,60 L 98,58 L 101,60 L 98,62 Z" fill="#818cf8" opacity="0.7"/>
  <path d="M 95,60 L 98,62 L 98,66 L 95,64 Z" fill="#6366f1" opacity="0.7"/>
  <path d="M 101,60 L 98,62 L 98,66 L 101,64 Z" fill="#4f46e5" opacity="0.7"/>
</svg>
