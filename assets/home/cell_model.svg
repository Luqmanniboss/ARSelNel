<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer Cell Membrane (Translucent, glowing) -->
  <defs>
    <radialGradient id="cellBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e3fffe" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#76d6d5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#006565" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="nucleusBg" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#d946ef"/>
      <stop offset="85%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#701a75"/>
    </radialGradient>
    <linearGradient id="mitochondriaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="golgiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cell Cytoplasm background -->
  <circle cx="100" cy="100" r="82" fill="url(#cellBg)" stroke="#e3fffe" stroke-width="2"/>
  <circle cx="100" cy="100" r="76" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Cytoplasm Particles/Ribosomes -->
  <circle cx="48" cy="58" r="2.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="142" cy="48" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="58" cy="142" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="152" cy="128" r="2.5" fill="#fef08a" opacity="0.8"/>
  <circle cx="108" cy="38" r="2" fill="#fef08a" opacity="0.8"/>
  <circle cx="82" cy="154" r="2.2" fill="#fef08a" opacity="0.7"/>

  <!-- Endoplasmic Reticulum (ER) around Nucleus -->
  <path d="M 64,100 C 64,74 78,58 100,58 C 122,58 136,74 136,100 C 136,126 122,142 100,142" stroke="#f472b6" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.35" stroke-dasharray="2 6"/>
  <path d="M 72,100 C 72,80 82,68 100,68 C 118,68 128,80 128,100 C 128,120 118,132 100,132" stroke="#f472b6" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Nucleus (Center purple sphere) -->
  <circle cx="100" cy="100" r="26" fill="url(#nucleusBg)" filter="url(#glow)" stroke="#fcd34d" stroke-width="0.5"/>
  <!-- Nucleolus inside Nucleus -->
  <circle cx="94" cy="94" r="8.5" fill="#fae8ff" opacity="0.95"/>

  <!-- Golgi Apparatus (Green folded ribbons) -->
  <path d="M 132,82 C 146,78 152,86 147,96 C 142,106 156,112 142,122" stroke="url(#golgiGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <path d="M 138,87 C 150,84 154,91 151,98 C 148,105 159,109 148,117" stroke="url(#golgiGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Golgi vesicles -->
  <circle cx="154" cy="78" r="3" fill="#22c55e"/>
  <circle cx="159" cy="94" r="2.5" fill="#22c55e"/>
  <circle cx="155" cy="112" r="3" fill="#22c55e"/>

  <!-- Mitochondria 1 (Orange bean shapes with internal folds) -->
  <g transform="translate(48, 62) rotate(-25)">
    <rect x="-14" y="-7" width="28" height="14" rx="7" fill="url(#mitochondriaGrad)" stroke="#ffedd5" stroke-width="0.75"/>
    <path d="M -9,0 Q -6,-3 -3,0 Q 0,3 3,0 Q 6,-3 9,0" stroke="#fff" stroke-width="1.2" fill="none"/>
  </g>
  
  <!-- Mitochondria 2 -->
  <g transform="translate(132, 138) rotate(35)">
    <rect x="-14" y="-7" width="28" height="14" rx="7" fill="url(#mitochondriaGrad)" stroke="#ffedd5" stroke-width="0.75"/>
    <path d="M -9,0 Q -6,-3 -3,0 Q 0,3 3,0 Q 6,-3 9,0" stroke="#fff" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Lysosomes / Vacuoles (Blue spheres) -->
  <circle cx="68" cy="118" r="6" fill="#38bdf8" stroke="#e0f2fe" stroke-width="0.75"/>
  <circle cx="66" cy="116" r="1.5" fill="#fff" opacity="0.6"/>

  <circle cx="118" cy="62" r="4.5" fill="#38bdf8" stroke="#e0f2fe" stroke-width="0.75"/>
  <circle cx="116" cy="60" r="1.2" fill="#fff" opacity="0.6"/>

  <!-- Centrosome (Yellow star shape or dots) -->
  <g transform="translate(82, 52)">
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#eab308" stroke-width="1.5"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#eab308" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="1.2" fill="#fef08a"/>
  </g>
</svg>
