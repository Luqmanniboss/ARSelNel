<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Clapperboard Base -->
  <g transform="translate(60, 52) rotate(-8)">
    <!-- Bottom Board -->
    <rect x="-30" y="-12" width="60" height="40" rx="4" fill="url(#clapperGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Play Icon on Clapper -->
    <path d="M -6,-5 L 8,3 L -6,11 Z" fill="#ffffff" />
    
    <!-- Top Clapper (open angle) -->
    <g transform="translate(-30, -12) rotate(-22)">
      <rect x="0" y="-8" width="60" height="8" rx="2" fill="#1e293b"/>
      <!-- Stripes on clapper -->
      <path d="M 8,-8 L 14,0 H 18 L 12,-8 Z" fill="#ffffff"/>
      <path d="M 23,-8 L 29,0 H 33 L 27,-8 Z" fill="#ffffff"/>
      <path d="M 38,-8 L 44,0 H 48 L 42,-8 Z" fill="#ffffff"/>
      <path d="M 53,-8 L 59,0 H 60 L 57,-8 Z" fill="#ffffff"/>
    </g>

    <!-- Normal top clapper edge stripe (hinge side) -->
    <rect x="-30" y="-14" width="60" height="3" fill="#0284c7"/>
  </g>
</svg>
