<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Trophy in background -->
  <g transform="translate(85, 45) scale(0.9)">
    <path d="M -8,-15 H 8 V -5 C 8,5 -8,5 -8,-5 Z" fill="url(#trophyGrad)" stroke="#b45309" stroke-width="1"/>
    <!-- Handles -->
    <path d="M -8,-11 C -14,-11 -14,-3 -8,-3" stroke="#b45309" stroke-width="1.2" fill="none"/>
    <path d="M 8,-11 C 14,-11 14,-3 8,-3" stroke="#b45309" stroke-width="1.2" fill="none"/>
    <!-- Stem and Base -->
    <path d="M -3,3 H 3 V 10 H -3 Z" fill="url(#trophyGrad)"/>
    <ellipse cx="0" cy="11" rx="8" ry="3" fill="#d97706"/>
  </g>

  <!-- Game Controller in foreground -->
  <g transform="translate(48, 55) rotate(-5)">
    <!-- Controller Body -->
    <rect x="-24" y="-14" width="48" height="28" rx="14" fill="url(#controllerGrad)" stroke="#6b21a8" stroke-width="1.5"/>
    <path d="M -24,0 C -24,14 -12,18 0,10 C 12,18 24,14 24,0" fill="url(#controllerGrad)" stroke="#6b21a8" stroke-width="1.5"/>

    <!-- D-pad (Left) -->
    <path d="M -16,-3 H -13 V -6 H -11 V -3 H -8 V -1 H -11 V 2 H -13 V -1 H -16 Z" fill="#f3e8ff"/>

    <!-- Action Buttons (Right) -->
    <circle cx="10" cy="-3" r="2.5" fill="#f3e8ff"/>
    <circle cx="15" cy="2" r="2.5" fill="#f3e8ff"/>
    
    <!-- Joystick details -->
    <circle cx="-3" cy="4" r="4.5" fill="#6b21a8" opacity="0.3"/>
    <circle cx="-3" cy="4" r="2.5" fill="#d8b4fe"/>
    <circle cx="5" cy="4" r="4.5" fill="#6b21a8" opacity="0.3"/>
    <circle cx="5" cy="4" r="2.5" fill="#d8b4fe"/>
  </g>
</svg>
