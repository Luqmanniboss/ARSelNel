<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Potted Plant (Left) -->
  <g transform="translate(35, 60)">
    <!-- Soil/Pot -->
    <path d="M -10,12 L -8,28 H 8 L 10,12 Z" fill="url(#potGrad)" stroke="#9a3412" stroke-width="1"/>
    <rect x="-11" y="8" width="22" height="4" rx="1" fill="#ea580c"/>

    <!-- Plant Stem -->
    <path d="M 0,8 Q -2,-10 -6,-18" stroke="#059669" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 0,8 Q 3,-6 8,-12" stroke="#059669" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Leaves -->
    <!-- Leaf 1 (Left) -->
    <path d="M -6,-18 C -14,-18 -15,-10 -6,-10 C 3,-10 2,-18 -6,-18 Z" fill="#10b981" stroke="#047857" stroke-width="0.8"/>
    <!-- Leaf 2 (Right) -->
    <path d="M 8,-12 C 14,-14 16,-8 9,-6 C 2,-4 2,-10 8,-12 Z" fill="#34d399" stroke="#047857" stroke-width="0.8"/>
    <!-- Top Leaf -->
    <path d="M -2,-22 C -2,-28 4,-26 2,-20 C 0,-14 -2,-16 -2,-22 Z" fill="#059669" stroke="#047857" stroke-width="0.8"/>
  </g>

  <!-- Plant Cell in Glass Flask (Right) -->
  <g transform="translate(78, 50)">
    <!-- Glass Flask Outer Dome -->
    <path d="M -6,-25 H 6 V -18 L 18,12 C 22,20 16,25 6,25 H -6 C -16,25 -22,20 -18,12 L -6,-18 Z" fill="#f0fdf4" fill-opacity="0.6" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="-8" y="-28" width="16" height="3" rx="1.5" fill="#a7f3d0"/>

    <!-- Plant Cell inside (Hexagonal green shape) -->
    <g transform="scale(0.85) translate(0, 5)">
      <!-- Cell Wall -->
      <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#34d399" stroke="#047857" stroke-width="1.5"/>
      <!-- Cell Membrane inside -->
      <polygon points="0,-9 8,-4 8,4 0,9 -8,4 -8,-4" fill="#6ee7b7" opacity="0.6"/>
      <!-- Nucleus -->
      <circle cx="-3" cy="2" r="3.5" fill="#a21caf"/>
      <!-- Large Vacuole (important feature of plant cell) -->
      <ellipse cx="3" cy="-2" rx="4" ry="5.5" fill="#38bdf8" stroke="#0284c7" stroke-width="0.5"/>
      <!-- Chloroplasts -->
      <circle cx="-5" cy="-5" r="1.5" fill="#15803d"/>
      <circle cx="5" cy="5" r="1.5" fill="#15803d"/>
    </g>

    <!-- Liquid line in flask -->
    <path d="M -16,10 Q 0,12 16,10 L 18,12 C 22,20 16,25 6,25 H -6 C -16,25 -22,20 -18,12 Z" fill="#34d399" fill-opacity="0.1" />
  </g>
</svg>
