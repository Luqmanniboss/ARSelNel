<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <!-- Glow filters -->
    <filter id="video-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="play-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#c2410c" flood-opacity="0.45" />
    </filter>

    <!-- Gradients -->
    <!-- Biological Cell Base Membrane (Orange / Coral Bioluminescence) -->
    <radialGradient id="cellBaseGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fdba74" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.95"/>
    </radialGradient>

    <!-- Cell Nucleus (Deep Magenta-Violet) -->
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="85%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>

    <!-- Mitochondria (Golden Yellow) -->
    <linearGradient id="mitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Floating Media Card (Glassmorphism) -->
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Play Button Orb Gradient -->
    <linearGradient id="playOrbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffedd5"/>
      <stop offset="70%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="playTriangleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Faint Molecular Nodes & Connecting Lines -->
  <g opacity="0.35" stroke="#fed7aa" stroke-width="1.2">
    <line x1="30" y1="50" x2="80" y2="30"/>
    <line x1="80" y1="30" x2="130" y2="60"/>
    <line x1="240" y1="40" x2="280" y2="70"/>
    <line x1="280" y1="70" x2="260" y2="120"/>
    <circle cx="30" cy="50" r="3" fill="#fed7aa"/>
    <circle cx="80" cy="30" r="3.5" fill="#fed7aa"/>
    <circle cx="130" cy="60" r="2.5" fill="#fed7aa"/>
    <circle cx="240" cy="40" r="2.5" fill="#fed7aa"/>
    <circle cx="280" cy="70" r="3.5" fill="#fed7aa"/>
  </g>

  <!-- BACKGROUND: Biological Cell Structure -->
  <g id="cell-structure" transform="translate(145, 140)">
    <!-- Outer Cell Membrane with organic curvature -->
    <path d="M -90,-20 C -95,-80 -30,-115 45,-105 C 115,-95 135,-30 120,40 C 105,105 35,115 -35,100 C -95,85 -85,30 -90,-20 Z" 
          fill="url(#cellBaseGrad)" 
          stroke="#fff7ed" 
          stroke-width="2.5" 
          stroke-opacity="0.85"
          filter="url(#video-glow)"/>

    <!-- Cytoplasm Internal Texture -->
    <path d="M -70,-15 C -75,-60 -25,-90 35,-80 C 90,-70 105,-20 95,30 C 80,80 25,90 -25,80 C -70,68 -65,25 -70,-15 Z" 
          fill="#ffedd5" 
          fill-opacity="0.25"/>

    <!-- Cell Nucleus -->
    <g transform="translate(-25, -20)">
      <circle cx="0" cy="0" r="32" fill="url(#nucleusGrad)" stroke="#fdf2f8" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Nucleolus -->
      <circle cx="-6" cy="-6" r="11" fill="#3b0764" fill-opacity="0.8"/>
      <!-- Nuclear pores highlight -->
      <circle cx="12" cy="10" r="2" fill="#fbcfe8" opacity="0.7"/>
      <circle cx="-14" cy="14" r="2" fill="#fbcfe8" opacity="0.7"/>
    </g>

    <!-- Mitochondria 1 (Top Right) -->
    <g transform="translate(55, -45) rotate(35)">
      <rect x="-18" y="-9" width="36" height="18" rx="9" fill="url(#mitoGrad)" stroke="#d97706" stroke-width="1.2"/>
      <path d="M -10,-4 Q -5,0 -10,4 M 0,-5 Q 5,0 0,5 M 10,-4 Q 15,0 10,4" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Mitochondria 2 (Bottom Left) -->
    <g transform="translate(-45, 50) rotate(-25)">
      <rect x="-15" y="-7.5" width="30" height="15" rx="7.5" fill="url(#mitoGrad)" stroke="#d97706" stroke-width="1"/>
      <path d="M -7,-3 Q -3,0 -7,3 M 0,-4 Q 4,0 0,4 M 7,-3 Q 11,0 7,3" stroke="#78350f" stroke-width="1" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Small Vacuole / Vesicles -->
    <circle cx="45" cy="45" r="12" fill="#bae6fd" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="20" cy="65" r="6" fill="#fef08a" fill-opacity="0.75"/>
    <circle cx="68" cy="12" r="5" fill="#fef08a" fill-opacity="0.75"/>
  </g>

  <!-- FOREGROUND: Floating Futuristic Video Screen & Play Console -->
  <g id="video-console" transform="translate(170, 142)">
    <!-- Media Player Frame -->
    <rect x="-85" y="-55" width="170" height="110" rx="20" 
          fill="url(#glassCardGrad)" 
          stroke="#ffffff" 
          stroke-width="2" 
          stroke-opacity="0.8"
          backdrop-filter="blur(16px)"
          filter="url(#play-shadow)"/>

    <!-- Film Sprocket / Video Header Detail -->
    <rect x="-85" y="-55" width="170" height="20" rx="10" fill="#0f172a" fill-opacity="0.3"/>
    <!-- Small Window Dots -->
    <circle cx="-70" cy="-45" r="3" fill="#f87171"/>
    <circle cx="-60" cy="-45" r="3" fill="#facc15"/>
    <circle cx="-50" cy="-45" r="3" fill="#4ade80"/>
    <!-- Live Badge -->
    <rect x="34" y="-50" width="38" height="11" rx="5.5" fill="#ea580c"/>
    <text x="53" y="-42" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#ffffff" text-anchor="middle">VIDEO</text>

    <!-- Video Progress Bar at Bottom of Screen -->
    <rect x="-70" y="36" width="140" height="4" rx="2" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="-70" y="36" width="85" height="4" rx="2" fill="#ea580c"/>
    <circle cx="15" cy="38" r="4" fill="#ffffff" filter="url(#video-glow)"/>

    <!-- Central Glowing Play Button Orb -->
    <g transform="translate(0, -2)">
      <circle cx="0" cy="0" r="28" fill="url(#playOrbGrad)" filter="url(#play-shadow)"/>
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
      <!-- Play Triangle -->
      <polygon points="-5,-10 11,0 -5,10" fill="url(#playTriangleGrad)"/>
    </g>
  </g>

  <!-- Decorative Sparkles and Educational Particles -->
  <g fill="#ffffff">
    <!-- Star 1 (Top Left) -->
    <path d="M 60,70 Q 60,78 68,78 Q 60,78 60,86 Q 60,78 52,78 Q 60,78 60,70 Z" opacity="0.9"/>
    <!-- Star 2 (Bottom Right) -->
    <path d="M 270,195 Q 270,201 276,201 Q 270,201 270,207 Q 270,201 264,201 Q 270,201 270,195 Z" opacity="0.85"/>
    <!-- Small Sparkle -->
    <circle cx="85" cy="180" r="2.5" opacity="0.8"/>
    <circle cx="245" cy="75" r="3" opacity="0.85"/>
  </g>
</svg>
