<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1924"/>
      <stop offset="100%" stop-color="#0f293d"/>
    </linearGradient>
    <radialGradient id="cytoGrad" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fdba74" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25"/>
    </radialGradient>
    <radialGradient id="nucGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="nucCoreGrad" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <linearGradient id="mitoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="520" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(45,212,191,0.06)" stroke-width="1">
    <line x1="0" y1="130" x2="760" y2="130"/>
    <line x1="0" y1="260" x2="760" y2="260"/>
    <line x1="0" y1="390" x2="760" y2="390"/>
    <line x1="190" y1="0" x2="190" y2="520"/>
    <line x1="380" y1="0" x2="380" y2="520"/>
    <line x1="570" y1="0" x2="570" y2="520"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 26)">
    <rect width="240" height="36" rx="10" fill="rgba(244,114,182,0.18)" stroke="#f472b6" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#f472b6"/>
    <text x="36" y="23" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#fdf2f8">STRUKTUR SEL HAIWAN</text>
  </g>

  <!-- Main Animal Cell Body (Irregular flexible shape) -->
  <path d="M 190 260 C 180 160, 280 100, 390 105 C 500 110, 560 170, 570 270 C 580 370, 500 430, 380 435 C 260 440, 200 360, 190 260 Z"
        fill="url(#cytoGrad)" stroke="#f472b6" stroke-width="4" stroke-dasharray="8 4" filter="url(#glow)"/>

  <path d="M 190 260 C 180 160, 280 100, 390 105 C 500 110, 560 170, 570 270 C 580 370, 500 430, 380 435 C 260 440, 200 360, 190 260 Z"
        fill="none" stroke="#fb7185" stroke-width="2.5"/>

  <!-- Cytoplasm Granules & Ribosomes -->
  <g fill="#fde047" opacity="0.75">
    <circle cx="260" cy="210" r="3"/>
    <circle cx="280" cy="330" r="3.5"/>
    <circle cx="330" cy="170" r="2.5"/>
    <circle cx="470" cy="200" r="3"/>
    <circle cx="490" cy="340" r="3.5"/>
    <circle cx="430" cy="400" r="3"/>
    <circle cx="240" cy="300" r="2.5"/>
  </g>

  <!-- Mitochondria 1 (Top Left) -->
  <g transform="translate(255, 160) rotate(-25)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="url(#mitoGrad)" stroke="#fed7aa" stroke-width="1.8"/>
    <!-- Cristae ridges -->
    <path d="M -22 -10 Q -15 0 -22 10 M -8 -12 Q 0 0 -8 12 M 6 -12 Q 14 0 6 12 M 20 -10 Q 25 0 20 10" 
          stroke="#ffedd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Mitochondria 2 (Bottom Right) -->
  <g transform="translate(480, 310) rotate(35)">
    <rect x="-35" y="-18" width="70" height="36" rx="18" fill="url(#mitoGrad)" stroke="#fed7aa" stroke-width="1.8"/>
    <path d="M -22 -10 Q -15 0 -22 10 M -8 -12 Q 0 0 -8 12 M 6 -12 Q 14 0 6 12 M 20 -10 Q 25 0 20 10" 
          stroke="#ffedd5" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Endoplasmic Reticulum & Golgi Apparatus -->
  <g fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.85" stroke-linecap="round">
    <path d="M 430 190 Q 455 175 470 195 Q 485 215 505 200"/>
    <path d="M 440 210 Q 465 195 480 215 Q 495 235 515 220"/>
    <path d="M 445 230 Q 470 215 485 235"/>
  </g>

  <!-- Small Vacuoles (Vakuol Kecil) -->
  <circle cx="310" cy="350" r="16" fill="rgba(6,182,212,0.4)" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="490" cy="165" r="12" fill="rgba(6,182,212,0.4)" stroke="#67e8f9" stroke-width="1.8"/>

  <!-- Nucleus (Center Core) -->
  <g transform="translate(370, 270)">
    <!-- Nuclear Envelope -->
    <circle cx="0" cy="0" r="64" fill="url(#nucGrad)" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
    <!-- Nuclear Pores -->
    <g fill="#fef08a">
      <circle cx="0" cy="-64" r="2.5"/><circle cx="45" cy="-45" r="2.5"/><circle cx="64" cy="0" r="2.5"/>
      <circle cx="45" cy="45" r="2.5"/><circle cx="0" cy="64" r="2.5"/><circle cx="-45" cy="45" r="2.5"/>
      <circle cx="-64" cy="0" r="2.5"/><circle cx="-45" cy="-45" r="2.5"/>
    </g>
    <!-- Chromatin Threads -->
    <path d="M -30 -15 Q -10 -40 15 -20 Q 40 0 20 25 Q 0 45 -25 20 Q -40 0 -30 -15 Z" 
          fill="none" stroke="#ddd6fe" stroke-width="2.5" opacity="0.6"/>
    <!-- Dense Nucleolus -->
    <circle cx="-5" cy="-5" r="22" fill="url(#nucCoreGrad)" stroke="#fbcfe8" stroke-width="2"/>
  </g>

  <!-- LABELS & CALLOUT PINS (KSSM TINGKATAN 1) -->

  <!-- 1. Membran Sel (Top) -->
  <g>
    <polyline points="290,105 270,55 120,55" fill="none" stroke="#f472b6" stroke-width="1.8"/>
    <circle cx="290" cy="105" r="4" fill="#f472b6"/>
    <rect x="25" y="38" width="165" height="36" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.2"/>
    <text x="35" y="55" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">MEMBRAN SEL</text>
    <text x="35" y="67" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Kawal bahan keluar/masuk</text>
  </g>

  <!-- 2. Sitoplasma (Left) -->
  <g>
    <polyline points="220,320 160,320 120,320" fill="none" stroke="#f97316" stroke-width="1.8"/>
    <circle cx="220" cy="320" r="4" fill="#f97316"/>
    <rect x="20" y="302" width="165" height="36" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.2"/>
    <text x="30" y="319" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">SITOPLASMA</text>
    <text x="30" y="331" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Medium jeli tindak balas sel</text>
  </g>

  <!-- 3. Mitokondrion (Top Right) -->
  <g>
    <polyline points="280,150 310,75 430,75" fill="none" stroke="#fb923c" stroke-width="1.8"/>
    <circle cx="280" cy="150" r="4" fill="#fb923c"/>
    <rect x="430" y="58" width="175" height="36" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.2"/>
    <text x="440" y="75" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">MITOKONDRION</text>
    <text x="440" y="87" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Jana tenaga melalui respirasi</text>
  </g>

  <!-- 4. Nukleus (Bottom Center) -->
  <g>
    <polyline points="370,320 370,470 230,470" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="370" cy="320" r="4" fill="#a855f7"/>
    <rect x="65" y="452" width="165" height="36" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="75" y="469" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">NUKLEUS</text>
    <text x="75" y="481" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Pusat kawalan sel &amp; DNA</text>
  </g>

  <!-- 5. Vakuol Kecil (Bottom Right) -->
  <g>
    <polyline points="325,355 420,440 560,440" fill="none" stroke="#06b6d4" stroke-width="1.8"/>
    <circle cx="325" cy="355" r="4" fill="#06b6d4"/>
    <rect x="560" y="422" width="175" height="36" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="570" y="439" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">VAKUOL KECIL</text>
    <text x="570" y="451" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Simpan cecair &amp; perkumuhan</text>
  </g>

  <!-- Bottom Key Fact Pill -->
  <g transform="translate(240, 474)">
    <rect width="280" height="26" rx="13" fill="rgba(15,23,42,0.85)" stroke="#334155" stroke-width="1"/>
    <text x="140" y="17" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="800" font-size="10.5" fill="#f472b6">
      Ciri Khas: Tiada Dinding Sel • Bentuk Tidak Tetap
    </text>
  </g>
</svg>

