<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1924"/>
      <stop offset="100%" stop-color="#092923"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="chloroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="vacuoleGrad" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.75"/>
    </radialGradient>
    <radialGradient id="nucGradP" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="65%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="nucCoreGradP" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </radialGradient>
    <linearGradient id="mitoGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="760" height="520" rx="20" fill="url(#bgGradP)"/>
  
  <!-- Subtle Science Grid -->
  <g stroke="rgba(34,197,94,0.06)" stroke-width="1">
    <line x1="0" y1="130" x2="760" y2="130"/>
    <line x1="0" y1="260" x2="760" y2="260"/>
    <line x1="0" y1="390" x2="760" y2="390"/>
    <line x1="190" y1="0" x2="190" y2="520"/>
    <line x1="380" y1="0" x2="380" y2="520"/>
    <line x1="570" y1="0" x2="570" y2="520"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(30, 26)">
    <rect width="250" height="36" rx="10" fill="rgba(34,197,94,0.18)" stroke="#22c55e" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#22c55e"/>
    <text x="36" y="23" font-family="'Nunito', sans-serif" font-weight="900" font-size="14" fill="#f0fdf4">STRUKTUR SEL TUMBUHAN</text>
  </g>

  <!-- Outer Rigid Hexagonal Cell Wall (Dinding Sel) -->
  <polygon points="260,95 500,95 590,260 500,430 260,430 170,260" 
           fill="#14532d" stroke="url(#wallGrad)" stroke-width="9" stroke-linejoin="round" filter="url(#glowGreen)"/>

  <!-- Middle Lamella Line -->
  <polygon points="260,95 500,95 590,260 500,430 260,430 170,260" 
           fill="none" stroke="#fde047" stroke-width="1.8" opacity="0.6"/>

  <!-- Inner Plasma Membrane (Membran Sel di bawah dinding sel) -->
  <polygon points="265,105 495,105 580,260 495,420 265,420 180,260" 
           fill="#0f2e22" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cytoplasm Matrix -->
  <!-- Large Central Vacuole (Vakuol Besar dengan sap sel & tonoplas) -->
  <!-- Takes ~70% of plant cell interior -->
  <ellipse cx="370" cy="275" rx="135" ry="105" fill="url(#vacuoleGrad)" stroke="#67e8f9" stroke-width="3"/>
  <!-- Tonoplast membrane shine -->
  <path d="M 270 230 Q 370 190 470 230" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.5" stroke-linecap="round"/>
  <!-- Cell sap solute particles inside vacuole -->
  <g fill="#e0f2fe" opacity="0.7">
    <circle cx="320" cy="260" r="4"/><circle cx="430" cy="250" r="5"/><circle cx="360" cy="320" r="4.5"/>
    <circle cx="400" cy="280" r="3.5"/><circle cx="450" cy="310" r="4"/>
  </g>

  <!-- Chloroplasts (Kloroplas dengan grana cakera tilakoid) -->
  <!-- Chloroplast 1 (Top Left) -->
  <g transform="translate(245, 155) rotate(-30)">
    <ellipse cx="0" cy="0" rx="36" ry="20" fill="url(#chloroGrad)" stroke="#86efac" stroke-width="2"/>
    <!-- Thylakoid grana stacks -->
    <rect x="-22" y="-10" width="8" height="20" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="-8" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="6" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="20" y="-8" width="6" height="16" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
  </g>

  <!-- Chloroplast 2 (Bottom Left) -->
  <g transform="translate(235, 365) rotate(25)">
    <ellipse cx="0" cy="0" rx="36" ry="20" fill="url(#chloroGrad)" stroke="#86efac" stroke-width="2"/>
    <rect x="-20" y="-10" width="8" height="20" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="-6" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="8" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
  </g>

  <!-- Chloroplast 3 (Top Right) -->
  <g transform="translate(515, 165) rotate(35)">
    <ellipse cx="0" cy="0" rx="36" ry="20" fill="url(#chloroGrad)" stroke="#86efac" stroke-width="2"/>
    <rect x="-20" y="-10" width="8" height="20" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="-6" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="8" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
  </g>

  <!-- Chloroplast 4 (Bottom Right) -->
  <g transform="translate(505, 370) rotate(-20)">
    <ellipse cx="0" cy="0" rx="36" ry="20" fill="url(#chloroGrad)" stroke="#86efac" stroke-width="2"/>
    <rect x="-20" y="-10" width="8" height="20" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="-6" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
    <rect x="8" y="-12" width="8" height="24" rx="2" fill="#15803d" stroke="#bbf7d0" stroke-width="1"/>
  </g>

  <!-- Mitochondria (Displaced to bottom margin) -->
  <g transform="translate(370, 400) rotate(10)">
    <rect x="-30" y="-14" width="60" height="28" rx="14" fill="url(#mitoGradP)" stroke="#fed7aa" stroke-width="1.8"/>
    <path d="M -18 -8 Q -12 0 -18 8 M -6 -10 Q 0 0 -6 10 M 6 -10 Q 12 0 6 10 M 18 -8 Q 22 0 18 8" 
          stroke="#ffedd5" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Nucleus (Pushed to the upper edge by large vacuole - typical plant cell structure!) -->
  <g transform="translate(370, 142)">
    <ellipse cx="0" cy="0" rx="48" ry="32" fill="url(#nucGradP)" stroke="#c084fc" stroke-width="2.5"/>
    <g fill="#fef08a">
      <circle cx="0" cy="-32" r="2"/><circle cx="34" cy="-22" r="2"/><circle cx="48" cy="0" r="2"/>
      <circle cx="34" cy="22" r="2"/><circle cx="0" cy="32" r="2"/><circle cx="-34" cy="22" r="2"/>
      <circle cx="-48" cy="0" r="2"/><circle cx="-34" cy="-22" r="2"/>
    </g>
    <!-- Chromatin & Nucleolus -->
    <circle cx="-6" cy="-2" r="14" fill="url(#nucCoreGradP)" stroke="#fbcfe8" stroke-width="1.5"/>
  </g>

  <!-- LABELS & CALLOUT PINS (KSSM TINGKATAN 1) -->

  <!-- 1. Dinding Sel (Top Left) -->
  <g>
    <polyline points="200,180 150,90 20,90" fill="none" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="200" cy="180" r="4" fill="#d97706"/>
    <rect x="20" y="72" width="165" height="36" rx="8" fill="#1e293b" stroke="#d97706" stroke-width="1.2"/>
    <text x="30" y="89" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">DINDING SEL</text>
    <text x="30" y="101" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Bentuk tetap &amp; sokongan sel</text>
  </g>

  <!-- 2. Kloroplas (Bottom Left) -->
  <g>
    <polyline points="230,370 160,370 20,370" fill="none" stroke="#22c55e" stroke-width="1.8"/>
    <circle cx="230" cy="370" r="4" fill="#22c55e"/>
    <rect x="20" y="352" width="165" height="36" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.2"/>
    <text x="30" y="369" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">KLOROPLAS</text>
    <text x="30" y="381" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Fotosintesis klorofil (glukosa)</text>
  </g>

  <!-- 3. Vakuol Besar (Center Bottom) -->
  <g>
    <polyline points="370,300 370,470 230,470" fill="none" stroke="#06b6d4" stroke-width="1.8"/>
    <circle cx="370" cy="300" r="4" fill="#06b6d4"/>
    <rect x="65" y="452" width="165" height="36" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="75" y="469" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">VAKUOL BESAR</text>
    <text x="75" y="481" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Simpan sap sel &amp; kesegahan</text>
  </g>

  <!-- 4. Nukleus (Top Right) -->
  <g>
    <polyline points="420,135 480,55 570,55" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="420" cy="135" r="4" fill="#a855f7"/>
    <rect x="570" y="38" width="170" height="36" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="580" y="55" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">NUKLEUS</text>
    <text x="580" y="67" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Pusat kawalan aktiviti sel</text>
  </g>

  <!-- 5. Membran Sel (Right) -->
  <g>
    <polyline points="575,240 620,240 570,240" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="575" cy="240" r="4" fill="#38bdf8"/>
    <rect x="570" y="222" width="170" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="580" y="239" font-family="'Nunito', sans-serif" font-weight="900" font-size="12" fill="#fff">MEMBRAN SEL</text>
    <text x="580" y="251" font-family="'Nunito', sans-serif" font-weight="600" font-size="9" fill="#cbd5e1">Lapisan telap memilih dalam</text>
  </g>

  <!-- Bottom Key Fact Pill -->
  <g transform="translate(240, 474)">
    <rect width="280" height="26" rx="13" fill="rgba(15,23,42,0.85)" stroke="#334155" stroke-width="1"/>
    <text x="140" y="17" text-anchor="middle" font-family="'Nunito', sans-serif" font-weight="800" font-size="10.5" fill="#4ade80">
      Ciri Khas: Dinding Sel Tegar • Kloroplas • Vakuol Besar
    </text>
  </g>
</svg>

