<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <!-- Glow filter for cell membrane and organelles -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradients -->
    <!-- Cell Membrane: Aqua Translucent Glow -->
    <radialGradient id="membraneGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="90%" stop-color="#0ea5e9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95"/>
    </radialGradient>
    
    <!-- Cell Cytoplasm Base -->
    <radialGradient id="cytoplasmGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="70%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </radialGradient>
    
    <!-- Nucleus: Deep Purple/Magenta 3D sphere -->
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#701a75"/>
    </radialGradient>
    
    <!-- Mitochondria: Glossy Orange -->
    <linearGradient id="mitochondriaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Golgi: Glossy Mint Green -->
    <linearGradient id="golgiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Faint Background Molecular/Grid details behind cell -->
  <g opacity="0.25">
    <line x1="20" y1="80" x2="120" y2="40" stroke="#99f6e4" stroke-width="1"/>
    <line x1="120" y1="40" x2="170" y2="100" stroke="#99f6e4" stroke-width="1"/>
    <line x1="120" y1="40" x2="100" y2="180" stroke="#99f6e4" stroke-width="1"/>
    <line x1="100" y1="180" x2="40" y2="220" stroke="#99f6e4" stroke-width="1"/>
    <circle cx="120" cy="40" r="3.5" fill="#5eead4"/>
    <circle cx="170" cy="100" r="3" fill="#5eead4"/>
    <circle cx="100" cy="180" r="4" fill="#5eead4"/>
  </g>

  <!-- Outer Cell Membrane (Aqua Translucent sphere) -->
  <circle cx="180" cy="150" r="125" fill="url(#cytoplasmGrad)" stroke="#2dd4bf" stroke-width="2.5" opacity="0.95"/>
  <circle cx="180" cy="150" r="125" fill="url(#membraneGrad)"/>
  
  <!-- Outer Membrane Highlight/Gloss effect -->
  <path d="M 80,100 A 125,125 0 0,1 270,55 A 120,120 0 0,0 90,110 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Endoplasmic Reticulum (ER) (Pink folded ribbons surrounding nucleus) -->
  <!-- Outer ER folds -->
  <path d="M 125,150 C 125,115 145,95 180,95 C 215,95 235,115 235,150 C 235,185 215,205 180,205 C 145,205 125,185 125,150 Z" stroke="#f472b6" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.35" stroke-dasharray="1 6" />
  <!-- Inner ER folds -->
  <path d="M 135,150 C 135,125 150,110 180,110 C 210,110 225,125 225,150 C 225,175 210,190 180,190 C 150,190 135,175 135,150 Z" stroke="#f472b6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 142,150 C 142,130 155,118 180,118 C 205,118 218,130 218,150 C 218,170 205,182 180,182 C 155,182 142,170 142,150 Z" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Nucleus (Center Purple Sphere) -->
  <circle cx="180" cy="150" r="32" fill="url(#nucleusGrad)" filter="url(#glow-heavy)"/>
  
  <!-- Nucleolus (Inner bright sphere) -->
  <circle cx="172" cy="142" r="10" fill="#fae8ff" opacity="0.95" filter="url(#soft-glow)"/>
  <circle cx="170" cy="140" r="4" fill="#ffffff"/>

  <!-- Golgi Apparatus (Green folded ribbons, right side) -->
  <g transform="translate(10, 0)">
    <path d="M 235,120 C 248,118 252,126 248,134 C 244,142 254,146 245,154" stroke="url(#golgiGrad)" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#soft-glow)"/>
    <path d="M 242,125 C 252,123 255,129 252,135 C 249,141 257,144 250,150" stroke="url(#golgiGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Golgi Vesicles (Budding green dots) -->
    <circle cx="260" cy="116" r="3.5" fill="#22c55e"/>
    <circle cx="264" cy="130" r="3" fill="#16a34a"/>
    <circle cx="258" cy="145" r="4" fill="#22c55e"/>
    <circle cx="262" cy="158" r="2.5" fill="#16a34a"/>
  </g>

  <!-- Mitochondria 1 (Orange sausage, top-left) -->
  <g transform="translate(105, 95) rotate(-35)">
    <rect x="-18" y="-9" width="36" height="18" rx="9" fill="url(#mitochondriaGrad)" stroke="#ffedd5" stroke-width="1" filter="url(#soft-glow)"/>
    <!-- Cristae (internal folds) -->
    <path d="M -12,0 Q -8,-5 -4,0 Q 0,5 4,0 Q 8,-5 12,0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Mitochondria 2 (Orange sausage, bottom-right) -->
  <g transform="translate(230, 215) rotate(45)">
    <rect x="-18" y="-9" width="36" height="18" rx="9" fill="url(#mitochondriaGrad)" stroke="#ffedd5" stroke-width="1" filter="url(#soft-glow)"/>
    <path d="M -12,0 Q -8,-5 -4,0 Q 0,5 4,0 Q 8,-5 12,0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Mitochondria 3 (Orange sausage, bottom-left) -->
  <g transform="translate(110, 205) rotate(20)">
    <rect x="-16" y="-8" width="32" height="16" rx="8" fill="url(#mitochondriaGrad)" stroke="#ffedd5" stroke-width="0.8" opacity="0.9"/>
    <path d="M -10,0 Q -7,-4 -4,0 Q -1,4 2,0 Q 5,-4 8,0" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Vacuoles / Lysosomes (Translucent blue/gold bubbles) -->
  <circle cx="85" cy="145" r="9" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1" opacity="0.8" filter="url(#soft-glow)"/>
  <circle cx="82" cy="142" r="2.5" fill="#ffffff" opacity="0.6"/>

  <circle cx="160" cy="72" r="7" fill="#fbbf24" stroke="#fef3c7" stroke-width="1" opacity="0.75"/>
  <circle cx="158" cy="70" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Small floating ribosomes (Tiny yellow/gold dots) -->
  <circle cx="75" cy="115" r="2.5" fill="#fcd34d" opacity="0.8"/>
  <circle cx="140" cy="50" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="215" cy="65" r="2.5" fill="#fcd34d" opacity="0.8"/>
  <circle cx="255" cy="95" r="2" fill="#fcd34d" opacity="0.8"/>
  <circle cx="155" cy="245" r="3" fill="#fcd34d" opacity="0.8"/>
  <circle cx="85" cy="235" r="2" fill="#fcd34d" opacity="0.8"/>
</svg>
