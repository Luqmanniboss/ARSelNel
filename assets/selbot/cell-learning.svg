  <!-- Organelles -->
  <circle cx="45" cy="45" r="10" fill="#d946ef" opacity="0.8"/>
  <rect x="25" y="35" width="12" height="6" rx="3" fill="#f59e0b" transform="rotate(30, 25, 35)"/>
  
  <!-- Magnifying glass -->
  <circle cx="65" cy="65" r="18" fill="#ffffff" fill-opacity="0.2" stroke="#0f172a" stroke-width="3"/>
