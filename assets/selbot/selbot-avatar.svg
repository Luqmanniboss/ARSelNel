<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer glowing circle background -->
  <circle cx="20" cy="20" r="19" fill="#e0f2f1" stroke="#008080" stroke-width="1.5"/>
  <!-- Head shape -->
  <rect x="9" y="10" width="22" height="20" rx="6" fill="#ffffff" stroke="#004f4f" stroke-width="1.5"/>
  <!-- Face screen -->
  <rect x="12" y="13" width="16" height="11" rx="3" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="17" cy="18" r="1.8" fill="#2dd4bf"/>
  <circle cx="23" cy="18" r="1.8" fill="#2dd4bf"/>
  <!-- Antenna -->
  <line x1="20" y1="10" x2="20" y2="4" stroke="#004f4f" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="20" cy="3" r="1.5" fill="#f59e0b"/>
</svg>
