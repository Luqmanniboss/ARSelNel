<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none">
  <defs>
    <!-- Shadow filter for the robot -->
    <filter id="robot-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f3c4b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Science Details: Orbit lines and particles -->
  <g opacity="0.3">
    <ellipse cx="75" cy="75" rx="65" ry="25" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(30, 75, 75)"/>
    <ellipse cx="75" cy="75" rx="65" ry="25" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="3 3" transform="rotate(-30, 75, 75)"/>
    <circle cx="20" cy="50" r="3" fill="#fbbf24"/>
    <circle cx="130" cy="100" r="4.5" fill="#38bdf8"/>
    <circle cx="35" cy="110" r="2.5" fill="#f472b6"/>
  </g>

  <!-- Robot Group with shadow filter -->
  <g filter="url(#robot-shadow)">
    <!-- Body -->
    <rect x="45" y="70" width="60" height="50" rx="15" fill="#ffffff" stroke="#008080" stroke-width="2.5"/>
    <rect x="55" y="80" width="40" height="30" rx="8" fill="#e0f2f1" opacity="0.6"/>
    <!-- Heartbeat/Glow wave on chest -->
    <path d="M 60,95 H 70 L 73,88 L 77,102 L 80,95 H 90" stroke="#008080" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neck -->
    <rect x="68" y="62" width="14" height="10" rx="3" fill="#cbd5e1" stroke="#008080" stroke-width="2"/>

    <!-- Head -->
    <rect x="40" y="22" width="70" height="42" rx="16" fill="#ffffff" stroke="#008080" stroke-width="2.5"/>
    <!-- Face Screen -->
    <rect x="48" y="30" width="54" height="26" rx="10" fill="#1e293b"/>
    <!-- Glowing eyes -->
    <circle cx="62" cy="43" r="3.5" fill="#2dd4bf"/>
    <circle cx="88" cy="43" r="3.5" fill="#2dd4bf"/>
    <path d="M 71,46 Q 75,49 79,46" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Antenna -->
    <line x1="75" y1="22" x2="75" y2="10" stroke="#008080" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="75" cy="7" r="4" fill="#fbbf24"/>

    <!-- Ears / Side bolts -->
    <rect x="34" y="33" width="6" height="16" rx="2" fill="#008080"/>
    <rect x="110" y="33" width="6" height="16" rx="2" fill="#008080"/>

    <!-- Left Arm (Resting) -->
    <path d="M 45,85 C 32,85 28,100 32,108" stroke="#008080" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Right Arm (Waving) -->
    <path d="M 105,85 C 120,85 125,65 122,55" stroke="#008080" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="121" cy="52" r="4" fill="#fbbf24"/>
    
    <!-- Legs -->
    <rect x="56" y="120" width="12" height="14" rx="4" fill="#cbd5e1" stroke="#008080" stroke-width="2"/>
    <rect x="82" y="120" width="12" height="14" rx="4" fill="#cbd5e1" stroke="#008080" stroke-width="2"/>
  </g>
</svg>
