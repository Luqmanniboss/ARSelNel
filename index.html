<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARSelNel - Sistem Pembelajaran Sains Interaktif</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/branding/apple-touch-icon.png"/>
  <link rel="icon" type="image/svg+xml" href="assets/home/logo.svg"/>
  <script>
    (function () {
      try {
        const rawUser = localStorage.getItem('arselnel_current_user') || sessionStorage.getItem('arselnel_current_user');
        if (rawUser) {
          const user = JSON.parse(rawUser);
          if (user && user.id && user.role) {
            const isStaff = user.role === 'admin' || user.role === 'superadmin' || user.role === 'teacher' || user.role === 'guru';
            location.replace(isStaff ? 'admin_dashboard/code.html' : 'halaman_utama/code.html');
            return;
          }
        }
      } catch (_) {}
      location.replace('auth/login.html' + location.search + location.hash);
    })();
  </script>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background: #004d4d; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <div style="text-align: center;">
    <div style="width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #28D9E8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <p style="font-size: 14px; opacity: 0.9; margin: 0;">Menghubungkan ke ARSelNel...</p>
  </div>
  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
