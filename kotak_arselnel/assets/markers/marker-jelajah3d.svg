<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Turquoise & Emerald Deep High-Contrast Gradients -->
    <linearGradient id="bgGradTurquoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="turqPortalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="emeraldCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="goldBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glowPortal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Crisp White Outer Margin for MindAR Border Contrast -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="25" y="25" width="950" height="950" fill="url(#bgGradTurquoise)" rx="30" stroke="#042f2e" stroke-width="12"/>

  <!-- High-Frequency Optical Calibration Grid & Asymmetric Tick Marks -->
  <g stroke="#115e59" stroke-width="2.5" opacity="0.75">
    <line x1="100" y1="50" x2="100" y2="950"/>
    <line x1="180" y1="50" x2="180" y2="950"/>
    <line x1="260" y1="50" x2="260" y2="950"/>
    <line x1="740" y1="50" x2="740" y2="950"/>
    <line x1="820" y1="50" x2="820" y2="950"/>
    <line x1="900" y1="50" x2="900" y2="950"/>

    <line x1="50" y1="100" x2="950" y2="100"/>
    <line x1="50" y1="180" x2="950" y2="180"/>
    <line x1="50" y1="260" x2="950" y2="260"/>
    <line x1="50" y1="740" x2="950" y2="740"/>
    <line x1="50" y1="820" x2="950" y2="820"/>
    <line x1="50" y1="900" x2="950" y2="900"/>
  </g>

  <!-- 4 ASYMMETRIC CORNER FIDUCIAL ANCHORS (Unique to Target 5: Jelajah 3D) -->
  <!-- Top-Left Corner: Octagonal Compass Target + Stepper Bars -->
  <g transform="translate(58, 58)">
    <polygon points="30,0 70,0 100,30 100,70 70,100 30,100 0,70 0,30" fill="#0f766e" stroke="#ffffff" stroke-width="5"/>
    <polygon points="36,16 64,16 84,36 84,64 64,84 36,84 16,64 16,36" fill="#042f2e" stroke="#2dd4bf" stroke-width="3"/>
    <polygon points="50,18 62,50 50,82 38,50" fill="#fde047"/>
    <polygon points="18,50 50,38 82,50 50,62" fill="#ffffff"/>
    <circle cx="50" cy="50" r="8" fill="#042f2e"/>
    <rect x="0" y="108" width="28" height="10" fill="#2dd4bf"/>
    <rect x="36" y="108" width="16" height="10" fill="#fde047"/>
    <rect x="60" y="108" width="40" height="10" fill="#ffffff"/>
  </g>

  <!-- Top-Right Corner: Isometric 3D Cube Fiducial + Corner Dots -->
  <g transform="translate(838, 58)">
    <rect x="0" y="0" width="104" height="104" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="5"/>
    <polygon points="52,12 90,34 52,56 14,34" fill="#5eead4" stroke="#042f2e" stroke-width="2"/>
    <polygon points="14,34 52,56 52,94 14,72" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
    <polygon points="90,34 52,56 52,94 90,72" fill="#10b981" stroke="#042f2e" stroke-width="2"/>
    <circle cx="18" cy="18" r="6" fill="#fde047"/>
    <circle cx="86" cy="86" r="6" fill="#ffffff"/>
    <rect x="-18" y="12" width="10" height="32" fill="#fde047"/>
    <rect x="-18" y="54" width="10" height="44" fill="#2dd4bf"/>
  </g>

  <!-- Bottom-Left Corner: Asymmetric Radar Sector & Binary Staircase -->
  <g transform="translate(58, 795)">
    <rect x="0" y="0" width="104" height="104" rx="18" fill="#042f2e" stroke="#ffffff" stroke-width="5"/>
    <circle cx="52" cy="52" r="38" fill="none" stroke="#2dd4bf" stroke-width="6"/>
    <circle cx="52" cy="52" r="22" fill="none" stroke="#fde047" stroke-width="5" stroke-dasharray="18,10"/>
    <path d="M 52 52 L 52 14 A 38 38 0 0 1 90 52 Z" fill="#10b981"/>
    <circle cx="34" cy="36" r="7" fill="#ffffff"/>
    <circle cx="68" cy="70" r="8" fill="#fde047"/>
    <polygon points="114,10 134,10 134,30 114,30" fill="#ffffff"/>
    <polygon points="114,42 144,42 144,62 114,62" fill="#34d399"/>
    <polygon points="114,74 128,74 128,94 114,94" fill="#fde047"/>
  </g>

  <!-- Bottom-Right Corner: Lab Flask / Portal Key Fiducial -->
  <g transform="translate(838, 795)">
    <rect x="0" y="0" width="104" height="104" rx="18" fill="#065f46" stroke="#fde047" stroke-width="5"/>
    <polygon points="38,16 66,16 66,38 88,82 16,82 38,38" fill="#ffffff" stroke="#042f2e" stroke-width="4"/>
    <polygon points="26,62 78,62 84,78 20,78" fill="#0d9488"/>
    <circle cx="46" cy="52" r="6" fill="#042f2e"/>
    <circle cx="60" cy="42" r="5" fill="#fde047"/>
    <circle cx="20" cy="24" r="7" fill="#2dd4bf"/>
    <circle cx="84" cy="24" r="7" fill="#2dd4bf"/>
  </g>

  <!-- Outer Octagonal Lab Portal Frame -->
  <polygon points="340,120 660,120 880,340 880,620 660,810 340,810 120,620 120,340"
           fill="none" stroke="#14b8a6" stroke-width="14"/>
  <polygon points="355,142 645,142 855,352 855,605 645,788 355,788 145,605 145,352"
           fill="none" stroke="#a7f3d0" stroke-width="4" stroke-dasharray="22, 12"/>

  <!-- Radial Portal Glow -->
  <circle cx="500" cy="468" r="285" fill="url(#glowPortal)"/>

  <!-- 360° Gyroscope Compass Ring & Degree Ticks -->
  <circle cx="500" cy="468" r="252" fill="#042f2e" stroke="#2dd4bf" stroke-width="12"/>
  <circle cx="500" cy="468" r="230" fill="#064e3b" stroke="#fde047" stroke-width="4" stroke-dasharray="12, 9"/>
  <circle cx="500" cy="468" r="204" fill="#022c22" stroke="#34d399" stroke-width="5"/>

  <!-- Cardinal 360° Markers (U, T, S, B) -->
  <g font-family="Arial, sans-serif" font-weight="900" font-size="22" text-anchor="middle">
    <rect x="478" y="196" width="44" height="32" rx="8" fill="#fde047"/>
    <text x="500" y="220" fill="#042f2e">360°</text>
    <rect x="734" y="452" width="36" height="32" rx="8" fill="#2dd4bf"/>
    <text x="752" y="476" fill="#042f2e">3D</text>
    <rect x="230" y="452" width="36" height="32" rx="8" fill="#ffffff"/>
    <text x="248" y="476" fill="#042f2e">AR</text>
  </g>

  <!-- 8 Organelle Station Nodes Around the 3D Portal (High Feature Density) -->
  <g stroke="#042f2e" stroke-width="4">
    <!-- Node 1 -->
    <circle cx="500" cy="264" r="20" fill="#fde047"/>
    <text x="500" y="271" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">1</text>
    <!-- Node 2 -->
    <circle cx="644" cy="324" r="20" fill="#ffffff"/>
    <text x="644" y="331" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">2</text>
    <!-- Node 3 -->
    <circle cx="704" cy="468" r="20" fill="#2dd4bf"/>
    <text x="704" y="475" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">3</text>
    <!-- Node 4 -->
    <circle cx="644" cy="612" r="20" fill="#34d399"/>
    <text x="644" y="619" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">4</text>
    <!-- Node 5 -->
    <circle cx="500" cy="672" r="20" fill="#fde047"/>
    <text x="500" y="679" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">5</text>
    <!-- Node 6 -->
    <circle cx="356" cy="612" r="20" fill="#ffffff"/>
    <text x="356" y="619" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">6</text>
    <!-- Node 7 -->
    <circle cx="296" cy="468" r="20" fill="#2dd4bf"/>
    <text x="296" y="475" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">7</text>
    <!-- Node 8 -->
    <circle cx="356" cy="324" r="20" fill="#34d399"/>
    <text x="356" y="331" font-family="Arial" font-weight="900" font-size="20" fill="#042f2e" text-anchor="middle" stroke="none">8</text>
  </g>

  <!-- ======================================================================= -->
  <!-- CENTRAL EMBLEM: 3D ISOMETRIC SCIENCE LAB PORTAL & HOLOGRAPHIC CELL CORE -->
  <!-- ======================================================================= -->
  <g id="center-3d-portal" transform="translate(500, 468)">
    <!-- Isometric Outer Lab Archway / Portal Frame -->
    <polygon points="0,-165 145,-82 145,82 0,165 -145,82 -145,-82"
             fill="#0f766e" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
    <!-- Isometric Cube Faces (High-contrast 3-tone shading) -->
    <!-- Top Face -->
    <polygon points="0,-145 126,-72 0,0 -126,-72"
             fill="#5eead4" stroke="#042f2e" stroke-width="5"/>
    <!-- Left Face -->
    <polygon points="-126,-72 0,0 0,145 -126,72"
             fill="#0d9488" stroke="#042f2e" stroke-width="5"/>
    <!-- Right Face -->
    <polygon points="126,-72 0,0 0,145 126,72"
             fill="#065f46" stroke="#042f2e" stroke-width="5"/>

    <!-- Inner Glowing Portal Doorway & Perspective Floor Grid -->
    <polygon points="0,-95 82,-47 82,47 0,95 -82,47 -82,-47"
             fill="#022c22" stroke="#fde047" stroke-width="6"/>
    <!-- Portal Energy Rings -->
    <ellipse cx="0" cy="0" rx="58" ry="32" fill="none" stroke="#2dd4bf" stroke-width="5" transform="rotate(-28)"/>
    <ellipse cx="0" cy="0" rx="58" ry="32" fill="none" stroke="#34d399" stroke-width="5" transform="rotate(28)"/>
    <!-- Core Nucleus / Crystal Star -->
    <polygon points="0,-48 14,-14 48,0 14,14 0,48 -14,14 -48,0 -14,-14"
             fill="#fde047" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#042f2e" stroke="#ffffff" stroke-width="3"/>

    <!-- Asymmetric Corner Notches Inside Cube -->
    <circle cx="-64" cy="-72" r="8" fill="#042f2e"/>
    <circle cx="64" cy="-72" r="8" fill="#042f2e"/>
    <rect x="-86" y="18" width="24" height="12" rx="4" fill="#ffffff" transform="skewY(28)"/>
    <rect x="62" y="18" width="24" height="12" rx="4" fill="#fde047" transform="skewY(-28)"/>
  </g>

  <!-- Left & Right Science Lab Feature Badges (High Optical Texture) -->
  <g transform="translate(132, 392)">
    <rect x="0" y="0" width="92" height="68" rx="14" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
    <text x="46" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#fde047" text-anchor="middle">8</text>
    <text x="46" y="54" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">STESEN</text>
  </g>
  <g transform="translate(132, 480)">
    <rect x="0" y="0" width="92" height="68" rx="14" fill="#059669" stroke="#fde047" stroke-width="4"/>
    <text x="46" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">GYRO</text>
    <text x="46" y="54" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#fde047" text-anchor="middle">360°</text>
  </g>

  <g transform="translate(776, 392)">
    <rect x="0" y="0" width="92" height="68" rx="14" fill="#059669" stroke="#fde047" stroke-width="4"/>
    <text x="46" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">MAKMAL</text>
    <text x="46" y="54" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#fde047" text-anchor="middle">SEL 3D</text>
  </g>
  <g transform="translate(776, 480)">
    <rect x="0" y="0" width="92" height="68" rx="14" fill="#0d9488" stroke="#ffffff" stroke-width="4"/>
    <text x="46" y="30" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#fde047" text-anchor="middle">KUIZ</text>
    <text x="46" y="54" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#ffffff" text-anchor="middle">&amp; XP</text>
  </g>

  <!-- Bottom High-Contrast Title Banner: JELAJAH 3D -->
  <g transform="translate(500, 892)">
    <rect x="-385" y="-44" width="770" height="78" rx="39" fill="#022c22" stroke="#2dd4bf" stroke-width="6"/>
    <rect x="-373" y="-34" width="746" height="58" rx="29" fill="#064e3b"/>

    <!-- Mini 3D Portal Icon on Left of Banner -->
    <g transform="translate(-318, -5)">
      <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="#2dd4bf" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="6" fill="#042f2e"/>
    </g>

    <!-- Primary Title: JELAJAH 3D -->
    <text x="-275" y="6" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="33" fill="#ffffff" letter-spacing="4">JELAJAH 3D</text>

    <!-- Subtitle Badge -->
    <rect x="95" y="-20" width="255" height="38" rx="19" fill="url(#goldBadgeGrad)"/>
    <text x="222" y="5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900" font-size="16" fill="#042f2e" letter-spacing="1.5" text-anchor="middle">MAKMAL 3D • 06</text>
  </g>
</svg>

