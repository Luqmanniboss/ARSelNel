<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Purple, Violet & Game Sci Gradients -->
    <linearGradient id="bgGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#170638"/>
    </linearGradient>
    <linearGradient id="violetMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pinkNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glowKuiz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep High-Contrast Base (White Outer Margin for Crisp Target Boundary) -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="25" y="25" width="950" height="950" fill="url(#bgGradPurple)" rx="30" stroke="#2e1065" stroke-width="12"/>

  <!-- High-Frequency Calibration Grid Pattern (For optical feature detection) -->
  <g stroke="#4c1d95" stroke-width="2" opacity="0.6">
    <line x1="100" y1="50" x2="100" y2="950"/>
    <line x1="200" y1="50" x2="200" y2="950"/>
    <line x1="300" y1="50" x2="300" y2="950"/>
    <line x1="700" y1="50" x2="700" y2="950"/>
    <line x1="800" y1="50" x2="800" y2="950"/>
    <line x1="900" y1="50" x2="900" y2="950"/>

    <line x1="50" y1="100" x2="950" y2="100"/>
    <line x1="50" y1="200" x2="950" y2="200"/>
    <line x1="50" y1="300" x2="950" y2="300"/>
    <line x1="50" y1="700" x2="950" y2="700"/>
    <line x1="50" y1="800" x2="950" y2="800"/>
    <line x1="50" y1="900" x2="950" y2="900"/>
  </g>

  <!-- 4 Corner Multi-Ring Optical Tracking Targets (Asymmetric Corner Marks) -->
  <!-- Top-Left Corner (Target Marker 03) -->
  <g transform="translate(60, 60)">
    <circle cx="50" cy="50" r="42" fill="#c084fc"/>
    <circle cx="50" cy="50" r="32" fill="#2e1065"/>
    <circle cx="50" cy="50" r="22" fill="#ffffff"/>
    <circle cx="50" cy="50" r="10" fill="#7c3aed"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#facc15" stroke-width="4"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#facc15" stroke-width="4"/>
    <rect x="75" y="75" width="20" height="20" fill="#facc15"/>
  </g>

  <!-- Top-Right Corner (Asymmetric Game D-Pad Geometry) -->
  <g transform="translate(840, 60)">
    <rect x="0" y="0" width="100" height="100" fill="#3b0764" rx="16" stroke="#c084fc" stroke-width="4"/>
    <!-- D-Pad Plus shape -->
    <rect x="35" y="15" width="30" height="70" fill="#a855f7" rx="6"/>
    <rect x="15" y="35" width="70" height="30" fill="#a855f7" rx="6"/>
    <circle cx="50" cy="50" r="8" fill="#ffffff"/>
    <circle cx="25" cy="50" r="4" fill="#facc15"/>
    <circle cx="75" cy="50" r="4" fill="#facc15"/>
    <circle cx="50" cy="25" r="4" fill="#facc15"/>
    <circle cx="50" cy="75" r="4" fill="#facc15"/>
  </g>

  <!-- Bottom-Left Corner (Diamond Optical Key + Dots) -->
  <g transform="translate(60, 840)">
    <polygon points="50,5 95,50 50,95 5,50" fill="#7c3aed" stroke="#ffffff" stroke-width="4"/>
    <polygon points="50,22 78,50 50,78 22,50" fill="#2e1065"/>
    <circle cx="50" cy="50" r="12" fill="#facc15"/>
    <circle cx="20" cy="20" r="6" fill="#f472b6"/>
    <circle cx="80" cy="20" r="6" fill="#f472b6"/>
    <circle cx="80" cy="80" r="6" fill="#f472b6"/>
  </g>

  <!-- Bottom-Right Corner (Matrix Optical Pattern) -->
  <g transform="translate(840, 840)">
    <circle cx="50" cy="50" r="45" fill="#581c87" stroke="#facc15" stroke-width="4"/>
    <rect x="25" y="25" width="22" height="22" fill="#ffffff" rx="4"/>
    <rect x="53" y="25" width="22" height="22" fill="#f472b6" rx="4"/>
    <rect x="25" y="53" width="22" height="22" fill="#a855f7" rx="4"/>
    <rect x="53" y="53" width="22" height="22" fill="#ffffff" rx="4"/>
    <circle cx="50" cy="50" r="6" fill="#2e1065"/>
  </g>

  <!-- Hexagonal Concentric Sci-Shield (Middle Anchor) -->
  <polygon points="500,140 820,320 820,680 500,860 180,680 180,320" 
           fill="none" stroke="#7c3aed" stroke-width="16" opacity="0.8"/>
  <polygon points="500,165 795,335 795,665 500,835 205,665 205,335" 
           fill="none" stroke="#c084fc" stroke-width="4" stroke-dasharray="16, 12"/>

  <!-- Radial Glow Behind Center Gamepad & Question Shield -->
  <circle cx="500" cy="485" r="280" fill="url(#glowKuiz)"/>

  <!-- Middle Game & Quiz Emblem Base Shield -->
  <circle cx="500" cy="485" r="235" fill="#3b0764" stroke="#a855f7" stroke-width="14"/>
  <circle cx="500" cy="485" r="215" fill="#2e1065" stroke="#f472b6" stroke-width="4" stroke-dasharray="8, 6"/>

  <!-- Science Circuit / Question Mark / Gamepad Asymmetric Geometry -->
  <!-- Top Circuit Track Left -->
  <path d="M 220 250 L 320 250 L 370 300 L 440 300" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="220" cy="250" r="8" fill="#facc15"/>
  <circle cx="440" cy="300" r="6" fill="#f472b6"/>

  <!-- Top Circuit Track Right -->
  <path d="M 780 250 L 680 250 L 630 300 L 560 300" fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
  <circle cx="780" cy="250" r="8" fill="#facc15"/>
  <circle cx="560" cy="300" r="6" fill="#f472b6"/>

  <!-- Side Sci Beacons -->
  <!-- Left Side Quiz A, B tokens -->
  <g transform="translate(140, 430)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">A</text>
  </g>
  <g transform="translate(140, 510)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <!-- Right Side Quiz C, D tokens -->
  <g transform="translate(805, 430)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#a855f7" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">C</text>
  </g>
  <g transform="translate(805, 510)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">D</text>
  </g>

  <!-- ============================================== -->
  <!-- CENTRAL ICON: GAMEPAD CONTROLLER + QUESTION MARK -->
  <!-- ============================================== -->
  <g id="center-game-icon" transform="translate(500, 485)">
    <!-- Gamepad Outer Body -->
    <path d="M -150 -40 C -150 -90 -90 -110 -20 -110 C 20 -110 90 -110 150 -40 C 180 -5 190 70 145 105 C 115 130 75 100 55 50 C 40 10 -40 10 -55 50 C -75 100 -115 130 -145 105 C -190 70 -180 -5 -150 -40 Z"
          fill="url(#violetMainGrad)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    
    <!-- Gamepad Inner Grip Accents -->
    <path d="M -140 -25 C -140 -70 -90 -85 -30 -85 C 30 -85 90 -85 140 -25"
          fill="none" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>

    <!-- Left D-Pad on Controller -->
    <g transform="translate(-85, -5)">
      <rect x="-12" y="-36" width="24" height="72" fill="#1e1b4b" rx="5" stroke="#ffffff" stroke-width="2"/>
      <rect x="-36" y="-12" width="72" height="24" fill="#1e1b4b" rx="5" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#facc15"/>
    </g>

    <!-- Right Action Buttons (Diamond layout: A, B, X, Y) -->
    <g transform="translate(85, -5)">
      <!-- Top Button Y -->
      <circle cx="0" cy="-26" r="11" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
      <!-- Right Button B -->
      <circle cx="26" cy="0" r="11" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
      <!-- Bottom Button A -->
      <circle cx="0" cy="26" r="11" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
      <!-- Left Button X -->
      <circle cx="-26" cy="0" r="11" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Center Giant Science Question Mark Glow -->
    <g transform="translate(0, -10)">
      <!-- Question mark shadow/stroke -->
      <path d="M -22 -65 C -22 -85 -5 -100 20 -100 C 45 -100 62 -85 62 -65 C 62 -48 50 -36 34 -25 C 20 -15 14 -5 14 10" 
            fill="none" stroke="#1e1b4b" stroke-width="26" stroke-linecap="round"/>
      <circle cx="14" cy="40" r="13" fill="#1e1b4b"/>
      
      <!-- Question mark core in gold -->
      <path d="M -22 -65 C -22 -85 -5 -100 20 -100 C 45 -100 62 -85 62 -65 C 62 -48 50 -36 34 -25 C 20 -15 14 -5 14 10" 
            fill="none" stroke="url(#goldAccent)" stroke-width="18" stroke-linecap="round"/>
      <circle cx="14" cy="40" r="9" fill="url(#goldAccent)"/>
    </g>
  </g>

  <!-- Stars / XP Points Decals (High Optical Entropy) -->
  <g transform="translate(380, 260)">
    <polygon points="20,0 25,12 38,14 29,23 31,36 20,30 9,36 11,23 2,14 15,12" fill="#facc15"/>
  </g>
  <g transform="translate(600, 260)">
    <polygon points="20,0 25,12 38,14 29,23 31,36 20,30 9,36 11,23 2,14 15,12" fill="#facc15"/>
  </g>
  <g transform="translate(320, 680)">
    <polygon points="15,0 19,9 29,10 22,17 23,27 15,22 7,27 8,17 1,10 11,9" fill="#f472b6"/>
  </g>
  <g transform="translate(650, 680)">
    <polygon points="15,0 19,9 29,10 22,17 23,27 15,22 7,27 8,17 1,10 11,9" fill="#f472b6"/>
  </g>

  <!-- Bottom Distinctive Banner (High-contrast typography for robust tracking) -->
  <g transform="translate(500, 890)">
    <!-- Banner Pill -->
    <rect x="-370" y="-42" width="740" height="74" rx="37" fill="#1e0538" stroke="#a855f7" stroke-width="5"/>
    <rect x="-360" y="-32" width="720" height="54" rx="27" fill="#3b0764"/>
    
    <!-- Gamepad Icon Mini -->
    <g transform="translate(-305, -5)">
      <circle cx="0" cy="0" r="18" fill="#a855f7"/>
      <rect x="-9" y="-3" width="18" height="6" fill="#ffffff" rx="2"/>
      <rect x="-3" y="-9" width="6" height="18" fill="#ffffff" rx="2"/>
    </g>

    <!-- Primary Title -->
    <text x="-260" y="4" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3">KUIZ &amp; PERMAINAN</text>

    <!-- Subtitle Badge -->
    <rect x="135" y="-18" width="185" height="34" rx="17" fill="#facc15"/>
    <text x="227" y="5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="16" fill="#2e1065" letter-spacing="1.5" text-anchor="middle">KOTAK AR • 03</text>
  </g>

  <!-- Center Crosshairs for Optical Tracking Precision -->
  <circle cx="500" cy="485" r="3" fill="#ffffff"/>
  <line x1="485" y1="485" x2="475" y2="485" stroke="#ffffff" stroke-width="2"/>
  <line x1="515" y1="485" x2="525" y2="485" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="470" x2="500" y2="460" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="500" x2="500" y2="510" stroke="#ffffff" stroke-width="2"/>
</svg>

