<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Emerald, Lime & Plant Cell Gradients -->
    <linearGradient id="bgGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </linearGradient>
    <linearGradient id="plantMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="limeNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="vacuoleCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGoldPlant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glowPlantCell" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#065f46" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep High-Contrast Base (White Outer Margin for Crisp Target Boundary) -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="25" y="25" width="950" height="950" fill="url(#bgGradGreen)" rx="30" stroke="#064e3b" stroke-width="12"/>

  <!-- High-Frequency Calibration Grid Pattern (For optical feature detection) -->
  <g stroke="#047857" stroke-width="2" opacity="0.65">
    <line x1="100" y1="50" x2="100" y2="950"/>
    <line x1="200" y1="50" x2="200" y2="950"/>
    <line x1="300" y1="50" x2="300" y2="950"/>
    <line x1="700" y1="50" x2="700" y2="950"/>
    <line x1="800" y1="50" x2="800" y2="950"/>
    <line x1="900" y1="50" x2="900" y2="950"/>

    <line x1="50" y1="100" x2="950" y2="100"/>
    <line x1="50" y1="200" x2="950" y2="200"/>
    <line x1="50" y1="300" x2="950" y2="300"/>
    <line x1="50" y1="700" x2="950" y2="700"/>
    <line x1="50" y1="800" x2="950" y2="800"/>
    <line x1="50" y1="900" x2="950" y2="900"/>
  </g>

  <!-- 4 Corner Asymmetric Optical Tracking Targets -->
  <!-- Top-Left Corner (Target Marker 05: Leaf & Chloroplast Solar Beacon) -->
  <g transform="translate(60, 60)">
    <circle cx="50" cy="50" r="42" fill="#10b981"/>
    <circle cx="50" cy="50" r="32" fill="#022c22"/>
    <circle cx="50" cy="50" r="22" fill="#ffffff"/>
    <circle cx="50" cy="50" r="10" fill="#047857"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#facc15" stroke-width="4"/>
    <line x1="0" y1="50" x2="100" y2="50" stroke="#facc15" stroke-width="4"/>
    <!-- Stylized Leaf Icon in corner -->
    <path d="M 50,22 C 68,26 72,44 50,62 C 28,44 32,26 50,22 Z" fill="#a3e635"/>
    <line x1="50" y1="22" x2="50" y2="62" stroke="#064e3b" stroke-width="2"/>
    <rect x="75" y="75" width="20" height="20" fill="#10b981"/>
  </g>

  <!-- Top-Right Corner (Asymmetric Stoma & Vein Optical Node Tracker) -->
  <g transform="translate(840, 60)">
    <rect x="0" y="0" width="100" height="100" fill="#022c22" rx="16" stroke="#10b981" stroke-width="4"/>
    <line x1="20" y1="25" x2="80" y2="75" stroke="#34d399" stroke-width="4"/>
    <line x1="20" y1="75" x2="80" y2="25" stroke="#34d399" stroke-width="4"/>
    <circle cx="20" cy="25" r="10" fill="#10b981"/>
    <circle cx="80" cy="75" r="10" fill="#facc15"/>
    <circle cx="20" cy="75" r="10" fill="#84cc16"/>
    <circle cx="80" cy="25" r="10" fill="#10b981"/>
    <circle cx="50" cy="50" r="12" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  </g>

  <!-- Bottom-Left Corner (Diamond Optical Vacuole Tracker) -->
  <g transform="translate(60, 840)">
    <polygon points="50,5 95,50 50,95 5,50" fill="#059669" stroke="#ffffff" stroke-width="4"/>
    <polygon points="50,22 78,50 50,78 22,50" fill="#022c22"/>
    <circle cx="50" cy="50" r="14" fill="#34d399"/>
    <circle cx="50" cy="50" r="7" fill="#ffffff"/>
    <circle cx="20" cy="20" r="6" fill="#facc15"/>
    <circle cx="80" cy="20" r="6" fill="#facc15"/>
    <circle cx="80" cy="80" r="6" fill="#38bdf8"/>
  </g>

  <!-- Bottom-Right Corner (Plant Optical Matrix Pattern) -->
  <g transform="translate(840, 840)">
    <circle cx="50" cy="50" r="45" fill="#064e3b" stroke="#10b981" stroke-width="4"/>
    <rect x="25" y="25" width="22" height="22" fill="#ffffff" rx="4"/>
    <rect x="53" y="25" width="22" height="22" fill="#84cc16" rx="4"/>
    <rect x="25" y="53" width="22" height="22" fill="#10b981" rx="4"/>
    <rect x="53" y="53" width="22" height="22" fill="#ffffff" rx="4"/>
    <circle cx="50" cy="50" r="6" fill="#022c22"/>
  </g>

  <!-- Rigid Octagonal Cell-Wall Perimeter (Middle Anchor) -->
  <polygon points="340,150 660,150 850,340 850,660 660,850 340,850 150,660 150,340" 
           fill="none" stroke="#059669" stroke-width="16" opacity="0.85"/>
  <polygon points="350,175 650,175 825,350 825,650 650,825 350,825 175,650 175,350" 
           fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="16, 12"/>

  <!-- Radial Glow Behind Center 3D Plant Hologram -->
  <circle cx="500" cy="485" r="280" fill="url(#glowPlantCell)"/>

  <!-- Middle Emblem Base Shield -->
  <circle cx="500" cy="485" r="235" fill="#022c22" stroke="#10b981" stroke-width="14"/>
  <circle cx="500" cy="485" r="215" fill="#064e3b" stroke="#34d399" stroke-width="4" stroke-dasharray="8, 6"/>

  <!-- Side Sci Beacons -->
  <!-- Left Side: Tokens -->
  <g transform="translate(138, 430)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#059669" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">SEL</text>
  </g>
  <g transform="translate(138, 510)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#047857" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle">3D</text>
  </g>

  <!-- Right Side: Plant Tokens -->
  <g transform="translate(807, 430)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#047857" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">TUM</text>
  </g>
  <g transform="translate(807, 510)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#065f46" stroke="#ffffff" stroke-width="3"/>
    <text x="27" y="38" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">BUH</text>
  </g>

  <!-- ============================================== -->
  <!-- CENTRAL ICON: RIGID PLANT CELL WITH CELL WALL & CHLOROPLASTS -->
  <!-- ============================================== -->
  <g id="center-plant-cell-icon" transform="translate(500, 485)">
    <!-- Outer Cell Wall Orbit Rings -->
    <rect x="-155" y="-105" width="310" height="210" rx="36" fill="none" stroke="#10b981" stroke-width="5" transform="rotate(-15)"/>
    <rect x="-155" y="-105" width="310" height="210" rx="36" fill="none" stroke="#a3e635" stroke-width="4" stroke-dasharray="12, 8" transform="rotate(20)"/>

    <!-- Thick Rigid Plant Cell Wall (Dinding Sel) -->
    <rect x="-120" y="-85" width="240" height="170" rx="28" fill="#047857" stroke="#ffffff" stroke-width="7"/>
    <!-- Plasma Membrane (Inner Layer) -->
    <rect x="-110" y="-75" width="220" height="150" rx="20" fill="#022c22" stroke="#34d399" stroke-width="3.5"/>

    <!-- Large Central Vacuole (Vakuol Besar - Distinct to Plant Cell) -->
    <g transform="translate(-15, 5)">
      <path d="M -50,-40 C -10,-55 45,-45 55,-10 C 65,25 35,50 -10,45 C -45,40 -65,10 -60,-20 Z" 
            fill="url(#vacuoleCyan)" opacity="0.88" stroke="#ffffff" stroke-width="3"/>
      <!-- Fluid Reflection Highlights -->
      <path d="M -35,-25 C -15,-35 25,-30 35,-15" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>
    </g>

    <!-- Chloroplast 1 (Kloroplas - Upper Left with Grana Disks) -->
    <g transform="translate(-68, -48) rotate(-25)">
      <ellipse cx="0" cy="0" rx="20" ry="12" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="-7" cy="0" rx="2" ry="6" fill="#a3e635"/>
      <ellipse cx="0" cy="0" rx="2" ry="6" fill="#a3e635"/>
      <ellipse cx="7" cy="0" rx="2" ry="6" fill="#a3e635"/>
    </g>

    <!-- Chloroplast 2 (Kloroplas - Lower Left) -->
    <g transform="translate(-72, 38) rotate(30)">
      <ellipse cx="0" cy="0" rx="19" ry="11" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="-6" cy="0" rx="2" ry="5" fill="#a3e635"/>
      <ellipse cx="0" cy="0" rx="2" ry="5" fill="#a3e635"/>
      <ellipse cx="6" cy="0" rx="2" ry="5" fill="#a3e635"/>
    </g>

    <!-- Chloroplast 3 (Kloroplas - Lower Right) -->
    <g transform="translate(68, 40) rotate(-20)">
      <ellipse cx="0" cy="0" rx="21" ry="12" fill="#15803d" stroke="#ffffff" stroke-width="2.5"/>
      <ellipse cx="-7" cy="0" rx="2" ry="6" fill="#a3e635"/>
      <ellipse cx="0" cy="0" rx="2" ry="6" fill="#a3e635"/>
      <ellipse cx="7" cy="0" rx="2" ry="6" fill="#a3e635"/>
    </g>

    <!-- Peripheral Nucleus (Pushed to Side by Vacuole) -->
    <g transform="translate(62, -25)">
      <circle cx="0" cy="0" r="26" fill="url(#amberGoldPlant)" stroke="#ffffff" stroke-width="3.5"/>
      <circle cx="3" cy="-2" r="10" fill="#854d0e"/>
      <circle cx="-5" cy="-4" r="6" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Mitochondria in Plant Cell -->
    <g transform="translate(18, -55) rotate(45)">
      <ellipse cx="0" cy="0" rx="16" ry="9" fill="#ea580c" stroke="#ffffff" stroke-width="2"/>
      <path d="M -10 0 Q -5 -5 0 0 Q 5 5 10 0" fill="none" stroke="#fef08a" stroke-width="2"/>
    </g>

    <!-- Floating 3D Badge -->
    <g transform="translate(0, -112)">
      <rect x="-52" y="-16" width="104" height="32" rx="16" fill="#facc15" stroke="#022c22" stroke-width="3"/>
      <text x="0" y="6" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#022c22" text-anchor="middle">TUMBUHAN</text>
    </g>
  </g>

  <!-- Bottom Distinctive Banner -->
  <g transform="translate(500, 890)">
    <rect x="-380" y="-42" width="760" height="74" rx="37" fill="#011812" stroke="#10b981" stroke-width="5"/>
    <rect x="-370" y="-32" width="740" height="54" rx="27" fill="#064e3b"/>
    
    <!-- Mini Plant Cell Icon -->
    <g transform="translate(-315, -5)">
      <rect x="-14" y="-12" width="28" height="24" rx="6" fill="#10b981"/>
      <rect x="-10" y="-8" width="20" height="16" rx="4" fill="#022c22"/>
      <circle cx="2" cy="0" r="5" fill="#38bdf8"/>
    </g>

    <!-- Primary Title -->
    <text x="-275" y="6" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="27" fill="#ffffff" letter-spacing="2.5">SEL TUMBUHAN 3D</text>

    <!-- Subtitle Badge -->
    <rect x="135" y="-18" width="200" height="34" rx="17" fill="#10b981"/>
    <text x="235" y="5" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" font-size="15" fill="#022c22" letter-spacing="1.5" text-anchor="middle">KOTAK AR • 05</text>
  </g>

  <!-- Center Crosshairs for Optical Tracking Precision -->
  <circle cx="500" cy="485" r="3" fill="#ffffff"/>
  <line x1="485" y1="485" x2="475" y2="485" stroke="#ffffff" stroke-width="2"/>
  <line x1="515" y1="485" x2="525" y2="485" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="470" x2="500" y2="460" stroke="#ffffff" stroke-width="2"/>
  <line x1="500" y1="500" x2="500" y2="510" stroke="#ffffff" stroke-width="2"/>
</svg>

