<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glowPlay" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep High-Contrast Base -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect x="25" y="25" width="950" height="950" fill="url(#bgGrad)" rx="30" stroke="#0f172a" stroke-width="12"/>

  <!-- High-Frequency Calibration Grid Pattern (For robust feature extraction) -->
  <g stroke="#1e293b" stroke-width="2" opacity="0.45">
    <line x1="100" y1="50" x2="100" y2="950"/>
    <line x1="200" y1="50" x2="200" y2="950"/>
    <line x1="300" y1="50" x2="300" y2="950"/>
    <line x1="700" y1="50" x2="700" y2="950"/>
    <line x1="800" y1="50" x2="800" y2="950"/>
    <line x1="900" y1="50" x2="900" y2="950"/>

    <line x1="50" y1="100" x2="950" y2="100"/>
    <line x1="50" y1="200" x2="950" y2="200"/>
    <line x1="50" y1="300" x2="950" y2="300"/>
    <line x1="50" y1="700" x2="950" y2="700"/>
    <line x1="50" y1="800" x2="950" y2="800"/>
    <line x1="50" y1="900" x2="950" y2="900"/>
  </g>

  <!-- Asymmetric Corner Features for Accurate 4-Way Orientation Detection -->
  <!-- Top-Left Corner: Triple Sci-Fi Target Bracket with solid core -->
  <g transform="translate(60, 60)">
    <rect width="120" height="120" fill="#ffffff" rx="10"/>
    <rect x="15" y="15" width="90" height="90" fill="#ea580c" rx="8"/>
    <circle cx="60" cy="60" r="28" fill="#ffffff"/>
    <circle cx="60" cy="60" r="14" fill="#0f172a"/>
    <path d="M 10 30 L 10 10 L 30 10" stroke="#ffffff" stroke-width="6" fill="none"/>
    <path d="M 110 90 L 110 110 L 90 110" stroke="#ffffff" stroke-width="6" fill="none"/>
  </g>

  <!-- Top-Right Corner: Hexagonal Matrix Dots (Orientation signature) -->
  <g transform="translate(820, 60)">
    <rect width="120" height="120" fill="#0f172a" stroke="#2dd4bf" stroke-width="6" rx="10"/>
    <circle cx="35" cy="35" r="12" fill="#2dd4bf"/>
    <circle cx="85" cy="35" r="8" fill="#ffffff"/>
    <circle cx="35" cy="85" r="8" fill="#ffffff"/>
    <circle cx="85" cy="85" r="14" fill="#ff7a00"/>
    <circle cx="60" cy="60" r="16" fill="#facc15"/>
  </g>

  <!-- Bottom-Left Corner: Variable Barcode Pattern (Orientation signature) -->
  <g transform="translate(60, 820)">
    <rect width="120" height="120" fill="#ffffff" rx="10"/>
    <rect x="12" y="15" width="8" height="90" fill="#0f172a"/>
    <rect x="26" y="15" width="16" height="90" fill="#0f172a"/>
    <rect x="48" y="15" width="6" height="90" fill="#ea580c"/>
    <rect x="60" y="15" width="22" height="90" fill="#0f172a"/>
    <rect x="88" y="15" width="10" height="90" fill="#0d9488"/>
    <rect x="104" y="15" width="6" height="90" fill="#0f172a"/>
  </g>

  <!-- Bottom-Right Corner: Concentric Target Rings (Orientation signature) -->
  <g transform="translate(820, 820)">
    <rect width="120" height="120" fill="#ffffff" rx="10"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ea580c" stroke-width="10"/>
    <circle cx="60" cy="60" r="32" fill="none" stroke="#0f172a" stroke-width="8"/>
    <circle cx="60" cy="60" r="16" fill="#2dd4bf"/>
  </g>

  <!-- Outer Sci-Fi Frame Border with Measurement Calibrations -->
  <rect x="75" y="75" width="850" height="850" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="80 30 20 30" opacity="0.8"/>
  <rect x="95" y="95" width="810" height="810" fill="none" stroke="#f97316" stroke-width="3" opacity="0.6"/>

  <!-- Top Banner: Title Block -->
  <g transform="translate(230, 80)">
    <rect width="540" height="85" fill="#0f172a" rx="18" stroke="#38bdf8" stroke-width="3"/>
    <text x="270" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">KOTAK ARSELNEL</text>
    <text x="270" y="68" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="15" fill="#38bdf8" text-anchor="middle" letter-spacing="2">★ TEKNOLOGI IMBAS &amp; BELAJAR 3D ★</text>
  </g>

  <!-- Bottom Banner: Category Name Block -->
  <g transform="translate(210, 835)">
    <rect width="580" height="90" fill="url(#orangeGrad)" rx="20" stroke="#ffffff" stroke-width="4"/>
    <text x="290" y="42" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">1. VIDEO PEMBELAJARAN</text>
    <text x="290" y="70" font-family="'Inter', Arial, sans-serif" font-weight="800" font-size="14" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">SAINS TINGKATAN 1 • STRUKTUR &amp; FUNGSI SEL</text>
  </g>

  <!-- Central Scientific Imagery: DNA Double Helix & Mitochondrion Texture -->
  <!-- Left Side: DNA Double Helix Motif (High contrast trackable edges) -->
  <g transform="translate(140, 260)">
    <path d="M 30 0 Q 80 60 30 120 T 30 240 T 30 360 T 30 480" fill="none" stroke="#2dd4bf" stroke-width="8"/>
    <path d="M 80 0 Q 30 60 80 120 T 80 240 T 80 360 T 80 480" fill="none" stroke="#facc15" stroke-width="8"/>
    <!-- Base pair rungs -->
    <line x1="42" y1="30" x2="68" y2="30" stroke="#ffffff" stroke-width="6"/>
    <line x1="30" y1="60" x2="80" y2="60" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="90" x2="68" y2="90" stroke="#ffffff" stroke-width="6"/>
    <line x1="55" y1="120" x2="55" y2="120" stroke="#ffffff" stroke-width="8"/>
    <line x1="42" y1="150" x2="68" y2="150" stroke="#ffffff" stroke-width="6"/>
    <line x1="30" y1="180" x2="80" y2="180" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="210" x2="68" y2="210" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="270" x2="68" y2="270" stroke="#ffffff" stroke-width="6"/>
    <line x1="30" y1="300" x2="80" y2="300" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="330" x2="68" y2="330" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="390" x2="68" y2="390" stroke="#ffffff" stroke-width="6"/>
    <line x1="30" y1="420" x2="80" y2="420" stroke="#ffffff" stroke-width="6"/>
    <line x1="42" y1="450" x2="68" y2="450" stroke="#ffffff" stroke-width="6"/>
  </g>

  <!-- Right Side: Microscope & Plant Cell Chloroplast Motif -->
  <g transform="translate(760, 260)">
    <!-- Microscope Silhouette -->
    <path d="M 40 40 L 40 180 Q 40 260 80 280 L 80 340 L 10 340 L 10 370 L 90 370 L 90 400 L 0 400 L 0 430 L 100 430 L 100 340 Q 110 200 40 180 Z" fill="#38bdf8" opacity="0.85"/>
    <rect x="25" y="10" width="30" height="60" fill="#ffffff" rx="4"/>
    <circle cx="40" cy="110" r="16" fill="#facc15"/>
    <!-- Chloroplast Disc Motifs -->
    <ellipse cx="50" cy="450" rx="35" ry="18" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="50" cy="450" rx="22" ry="10" fill="#047857"/>
  </g>

  <!-- CENTERPIECE: Massive High-Contrast Video Play Emblem in Hexagonal Chamber -->
  <!-- Ambient Glow -->
  <circle cx="500" cy="500" r="260" fill="url(#glowPlay)"/>

  <!-- Outer Heavy Trackable Hexagon with Alignment Cutouts -->
  <polygon points="500,240 730,370 730,630 500,760 270,630 270,370" fill="#0f172a" stroke="#ffffff" stroke-width="16"/>
  <polygon points="500,260 710,380 710,620 500,740 290,620 290,380" fill="none" stroke="#ff7a00" stroke-width="8"/>

  <!-- Mid Concentric Trackable Ring -->
  <circle cx="500" cy="500" r="170" fill="#ffffff" stroke="#0f172a" stroke-width="10"/>
  <circle cx="500" cy="500" r="145" fill="url(#orangeGrad)" stroke="#ffffff" stroke-width="6"/>

  <!-- Iconic Bold Play Triangle with Inner Core -->
  <polygon points="460,405 600,500 460,595" fill="#ffffff" stroke="#0f172a" stroke-width="10"/>
  <polygon points="475,435 565,500 475,565" fill="#0f172a"/>

  <!-- Surrounding Satellite Camera & Video Symbols -->
  <!-- Upper Left Satellite: Clapperboard Icon -->
  <g transform="translate(320, 310)">
    <rect width="64" height="50" fill="#ffffff" rx="8" stroke="#0f172a" stroke-width="5"/>
    <path d="M 0 16 L 64 16" stroke="#0f172a" stroke-width="6"/>
    <path d="M 12 0 L 22 16 M 32 0 L 42 16 M 52 0 L 62 16" stroke="#ea580c" stroke-width="5"/>
  </g>

  <!-- Upper Right Satellite: 4K HD Camera Icon -->
  <g transform="translate(620, 310)">
    <rect width="65" height="48" fill="#ffffff" rx="8" stroke="#0f172a" stroke-width="5"/>
    <polygon points="65,20 85,10 85,38 65,28" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <circle cx="32" cy="24" r="12" fill="#0d9488"/>
  </g>

  <!-- Lower Left Satellite: Biology Cell Icon -->
  <g transform="translate(315, 620)">
    <circle cx="35" cy="35" r="30" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <circle cx="35" cy="35" r="16" fill="#8b5cf6"/>
    <circle cx="38" cy="32" r="6" fill="#facc15"/>
  </g>

  <!-- Lower Right Satellite: Science Flask Icon -->
  <g transform="translate(625, 620)">
    <circle cx="35" cy="35" r="30" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <path d="M 28 15 L 42 15 M 35 15 L 35 28 L 48 48 Q 50 52 45 55 L 25 55 Q 20 52 22 48 L 35 28" fill="#10b981" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Dynamic Calibration Coordinates around perimeter -->
  <text x="500" y="195" font-family="monospace" font-weight="900" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="4">TARGET ID: ARS-CUBE-VID-01</text>
  <text x="500" y="805" font-family="monospace" font-weight="900" font-size="14" fill="#f97316" text-anchor="middle" letter-spacing="3">FREQ: 5.8GHZ • MINDAR OPTICAL TRACKING</text>
</svg>

