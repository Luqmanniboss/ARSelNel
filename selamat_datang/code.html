<script>
  (function () {
    try {
      const rawUser = localStorage.getItem('arselnel_current_user') || sessionStorage.getItem('arselnel_current_user');
      if (rawUser) {
        const user = JSON.parse(rawUser);
        if (user && user.id && user.role) {
          const isStaff = user.role === 'admin' || user.role === 'superadmin' || user.role === 'teacher' || user.role === 'guru';
          location.replace(isStaff ? '../admin_dashboard/code.html' : '../halaman_utama/code.html');
          return;
        }
      }
    } catch (_) {}
    location.replace('../auth/login.html' + location.search + location.hash);
  })();
</script>

<!-- Micro-interaction Script -->
<script>
        const carousel = document.getElementById('carousel');
        const dots = document.querySelectorAll('.flex.justify-center.gap-2 div');

        carousel.addEventListener('scroll', () => {
            const scrollPos = carousel.scrollLeft;
            const cardWidth = carousel.offsetWidth;
            const activeIndex = Math.round(scrollPos / cardWidth);

            dots.forEach((dot, index) => {
                if (index === activeIndex) {
                    dot.classList.add('bg-primary', 'active-dot');
                    dot.classList.remove('bg-outline-variant', 'w-2');
                } else {
                    dot.classList.remove('bg-primary', 'active-dot');
                    dot.classList.add('bg-outline-variant', 'w-2');
                }
            });
        });

        // Simple button active state visual feedback
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
            btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
            btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
        });
    </script>
