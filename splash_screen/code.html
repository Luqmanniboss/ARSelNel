<script>
  (function () {
    try {
      const rawUser = localStorage.getItem('arselnel_current_user') || sessionStorage.getItem('arselnel_current_user');
      if (rawUser) {
        const user = JSON.parse(rawUser);
        if (user && user.id && user.role) {
          const isStaff = user.role === 'admin' || user.role === 'superadmin' || user.role === 'teacher' || user.role === 'guru';
          location.replace(isStaff ? '../admin_dashboard/code.html' : '../halaman_utama/code.html');
          return;
        }
      }
    } catch (_) {}
    location.replace('../auth/login.html' + location.search + location.hash);
  })();
</script>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        /* Ambient biological background pulse */
        @keyframes orbit {
            from { transform: rotate(0deg) translateX(40px) rotate(0deg); }
            to   { transform: rotate(360deg) translateX(40px) rotate(-360deg); }
        }
        
        .cell-particle {
            animation: orbit 15s linear infinite;
        }

        /* Custom Loading Spinner */
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-ring {
            border: 3px solid transparent;
            border-top-color: #93f2f2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin-slow 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        /* Floating Logo Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;

<script>
        // Simulate progress bar for better UX feel during splash
        let progress = 0;
        const progressBar = document.getElementById('splash-progress');
        
        const interval = setInterval(() => {
            progress += Math.random() * 15;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                // Logic to transition to the next screen would go here
                window.location.href = '../selamat_datang/code.html';
            }
            progressBar.style.width = `${progress}%`;
        }, 300);

        // Subtle parallax effect on mouse move (for desktop curiosity)
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const content = document.querySelector('.animate-float');
            if (content) {
                content.style.transform = `translate(${(x - 0.5) * 20}px, ${(y - 0.5) * 20}px)`;
            }
        });
    </script>
